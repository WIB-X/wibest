<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#2563eb"/>

  <!-- Logo / Brand -->
  <text x="600" y="240" font-family="Arial, sans-serif" font-size="120" font-weight="800"
        fill="#ffffff" text-anchor="middle" letter-spacing="-4">WIB</text>

  <!-- Tagline -->
  <text x="600" y="320" font-family="Arial, sans-serif" font-size="32" font-weight="400"
        fill="#93c5fd" text-anchor="middle">Compare the Best of Everything in India</text>

  <!-- Category pills -->
  <rect x="170" y="390" width="130" height="44" rx="22" fill="#1d4ed8" opacity="0.8"/>
  <text x="235" y="418" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">Schools</text>

  <rect x="320" y="390" width="140" height="44" rx="22" fill="#1d4ed8" opacity="0.8"/>
  <text x="390" y="418" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">Colleges</text>

  <rect x="480" y="390" width="160" height="44" rx="22" fill="#1d4ed8" opacity="0.8"/>
  <text x="560" y="418" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">Electronics</text>

  <rect x="660" y="390" width="150" height="44" rx="22" fill="#1d4ed8" opacity="0.8"/>
  <text x="735" y="418" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">Cars &amp; Bikes</text>

  <rect x="830" y="390" width="140" height="44" rx="22" fill="#1d4ed8" opacity="0.8"/>
  <text x="900" y="418" font-family="Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">Hospitals</text>

  <!-- Domain -->
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="24" font-weight="400"
        fill="#64748b" text-anchor="middle">wibest.in</text>
</svg>
