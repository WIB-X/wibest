<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seed Batch 4 (30 seasonal EN posts) — WIB Admin</title>
<meta name="robots" content="noindex,nofollow">
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;background:#0b0f17;color:#e5e7eb}
h1{color:#60a5fa}
button{background:#2563eb;color:#fff;border:0;padding:12px 24px;font-size:16px;border-radius:8px;cursor:pointer;margin:6px 4px}
button:hover{background:#1d4ed8}
button:disabled{background:#374151;cursor:not-allowed}
#log{background:#111827;border:1px solid #1f2937;border-radius:8px;padding:16px;margin-top:20px;max-height:600px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap}
.ok{color:#10b981}.err{color:#ef4444}
.warn{background:#7c2d12;color:#fed7aa;padding:12px;border-radius:8px;margin:16px 0}
.stat{display:inline-block;background:#1f2937;padding:8px 14px;border-radius:8px;margin:4px;font-family:ui-monospace,monospace}
.group{background:#111827;padding:14px 16px;border-radius:8px;margin:12px 0;border-left:3px solid #60a5fa}
.group h3{margin:0 0 8px;color:#93c5fd;font-size:14px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="/config.js"></script>
<script src="/admin-auth-gate.js"></script>
</head>
<body>
<h1>WIB Batch-4 Blog Seeder (Seasonal 2026)</h1>
<p>Seeds 30 English blog posts targeting April-July 2026 seasonal searches: summer appliances, post-12th board results, tax-saving deadline, hill stations.</p>
<div class="warn">⚠️ Set <code>allow write: if true;</code> on <code>/blog_posts</code> temporarily. <strong>REVERT to <code>isAdmin()</code> right after seeding.</strong></div>
<div id="counts"></div>
<button onclick="seedAll()">🚀 Seed Everything (30 posts)</button>
<button onclick="seedSet('summer')">Seed Summer Appliances (8)</button>
<button onclick="seedSet('edu')">Seed Education (8)</button>
<button onclick="seedSet('tax')">Seed Tax-Saving (8)</button>
<button onclick="seedSet('travel')">Seed Hill Stations (6)</button>
<div id="log"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>var BLOG_POSTS = {}; var SUMMER_KEYS, EDU_KEYS, TAX_KEYS, TRAVEL_KEYS;</script>
<script src="/seed-data-batch4a-summer.js"></script>
<script>SUMMER_KEYS = new Set(Object.keys(BLOG_POSTS));</script>
<script src="/seed-data-batch4b-education.js"></script>
<script>EDU_KEYS = new Set([...Object.keys(BLOG_POSTS)].filter(k => !SUMMER_KEYS.has(k)));</script>
<script src="/seed-data-batch4c-tax.js"></script>
<script>TAX_KEYS = new Set([...Object.keys(BLOG_POSTS)].filter(k => !SUMMER_KEYS.has(k) && !EDU_KEYS.has(k)));</script>
<script src="/seed-data-batch4d-hillstations.js"></script>
<script>TRAVEL_KEYS = new Set([...Object.keys(BLOG_POSTS)].filter(k => !SUMMER_KEYS.has(k) && !EDU_KEYS.has(k) && !TAX_KEYS.has(k)));</script>
<script>
const db = initFirebase();
const log = document.getElementById('log');
function l(m,c){var d=document.createElement('div');d.textContent=m;if(c)d.className=c;log.appendChild(d);log.scrollTop=log.scrollHeight;}
document.getElementById('counts').innerHTML =
  '<span class="stat">Summer: '+SUMMER_KEYS.size+'</span>'+
  '<span class="stat">Education: '+EDU_KEYS.size+'</span>'+
  '<span class="stat">Tax: '+TAX_KEYS.size+'</span>'+
  '<span class="stat">Hill Stations: '+TRAVEL_KEYS.size+'</span>'+
  '<span class="stat">Total: '+Object.keys(BLOG_POSTS).length+'</span>';

async function seedSubset(slugs, label){
  l('--- Seeding '+slugs.length+' '+label+' posts ---');
  let ok=0, err=0;
  for(const slug of slugs){
    try{
      const data = BLOG_POSTS[slug];
      data.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
      data.publishedAt = firebase.firestore.Timestamp.fromDate(new Date(data.date||'2026-04-19'));
      await db.collection('blog_posts').doc(slug).set(data, {merge:false});
      l('OK '+slug, 'ok'); ok++;
    }catch(e){l('FAIL '+slug+': '+e.message,'err'); err++;}
  }
  l('=== '+label+' done: '+ok+' ok, '+err+' failed ===', err?'err':'ok');
}
function seedSet(kind){
  if(kind==='summer') return seedSubset([...SUMMER_KEYS],'Summer Appliances');
  if(kind==='edu') return seedSubset([...EDU_KEYS],'Education');
  if(kind==='tax') return seedSubset([...TAX_KEYS],'Tax-Saving');
  if(kind==='travel') return seedSubset([...TRAVEL_KEYS],'Hill Stations');
}
async function seedAll(){
  await seedSubset([...SUMMER_KEYS],'Summer Appliances');
  await seedSubset([...EDU_KEYS],'Education');
  await seedSubset([...TAX_KEYS],'Tax-Saving');
  await seedSubset([...TRAVEL_KEYS],'Hill Stations');
  l('\n🎉 ALL 30 POSTS SEEDED');
}
</script>
</body>
</html>
