<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details — WIB</title>
<meta name="description" content="Compare specs, price, and reviews for this product on WIB — India's comparison platform.">
<meta property="og:site_name" content="WIB">
<meta property="og:type" content="website">
<meta property="og:image" content="https://wibest.in/og-default.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@wibest_in">
<link rel="canonical" href="https://wibest.in/electronics-detail.html">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32"><link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=20260421b">
<link rel="stylesheet" href="/polish.css?v=20260421">
<style>
.content{max-width:1200px;margin:calc(var(--nav-height)+var(--cat-height)+24px) auto 60px;padding:0 24px}
.breadcrumb{font-size:13px;color:var(--text-muted);margin-bottom:20px}.breadcrumb a{color:var(--accent)}
.detail-grid{display:grid;grid-template-columns:1fr 360px;gap:24px}
.hero-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:32px;transition:background .3s}
.product-name{font-family:'Outfit',sans-serif;font-size:28px;font-weight:700;letter-spacing:-0.02em;margin-bottom:8px}
.product-price{font-family:'Outfit',sans-serif;font-size:24px;font-weight:700;color:var(--accent);margin-bottom:12px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.badge{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;background:var(--tag-bg);color:var(--tag-text)}
.badge.brand{background:var(--accent-light);color:var(--accent)}
.badge.rating{background:var(--green-bg);color:var(--green)}
.desc{color:var(--text-secondary);font-size:14px;line-height:1.7}
.section{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-top:20px;transition:background .3s}
.section-title{font-family:'Outfit',sans-serif;font-size:18px;font-weight:600;margin-bottom:16px}
.specs-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.spec-item{padding:14px 16px;background:var(--bg-secondary);border-radius:8px;transition:background .3s}
.spec-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.spec-value{font-size:14px;font-weight:600}
.review-form{background:var(--bg-secondary);border-radius:8px;padding:20px;margin-top:16px}
.review-form h4{font-size:15px;font-weight:600;margin-bottom:12px}
.rf-row{display:flex;gap:12px;margin-bottom:12px}
.rf-row input,.rf-row textarea{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text-primary);font-family:inherit;font-size:14px}
.rf-row input:focus,.rf-row textarea:focus{outline:none;border-color:var(--accent)}
.rf-row textarea{resize:vertical;min-height:70px}
.star-select{display:flex;gap:4px;margin-bottom:12px}
.star-select button{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--bg-card);cursor:pointer;font-size:16px;color:var(--text-muted);transition:all .2s}
.star-select button.active{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.form-msg{font-size:13px;text-align:center;padding:8px;border-radius:6px;margin-top:8px}
.form-msg.success{background:var(--green-bg);color:var(--green)}
.form-msg.error{background:#fef2f2;color:var(--red)}
.review-empty{color:var(--text-muted);font-size:14px;padding:16px;text-align:center;background:var(--bg-secondary);border-radius:8px}
.review-item{padding:14px;background:var(--bg-secondary);border-radius:8px;margin-bottom:8px}
.sidebar{display:flex;flex-direction:column;gap:20px}
.sidebar-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;transition:background .3s}
.sidebar-title{font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;margin-bottom:12px}
.key-specs{display:flex;flex-direction:column;gap:10px}
.key-spec{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.key-spec:last-child{border-bottom:none}
.key-spec .label{font-size:13px;color:var(--text-secondary)}
.key-spec .value{font-size:13px;font-weight:600}
.loading{text-align:center;padding:100px 24px;color:var(--text-muted)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
/* Sticky buy bar — visible on scroll */
.sticky-buy{position:fixed;bottom:0;left:0;right:0;background:var(--bg-card);border-top:1px solid var(--border);padding:10px 24px;display:none;align-items:center;justify-content:center;gap:12px;z-index:999;box-shadow:0 -2px 16px rgba(0,0,0,.1);transition:background .3s}
.sticky-buy.visible{display:flex}
.sticky-buy .sb-name{font-size:14px;font-weight:600;flex-shrink:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.sticky-buy .sb-price{font-size:16px;font-weight:700;color:var(--accent);white-space:nowrap}
.sticky-buy .sb-btns{display:flex;gap:8px;flex-shrink:0}
.sticky-buy .sb-btn{padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.sticky-buy .sb-amazon{background:#ff9900;color:#111}
.sticky-buy .sb-flipkart{background:#2874f0;color:#fff}
@media(max-width:900px){.detail-grid{grid-template-columns:1fr}.specs-grid{grid-template-columns:1fr}.product-name{font-size:22px}.rf-row{flex-direction:column}.sticky-buy .sb-name{display:none}}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JBXR43H9PE"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-JBXR43H9PE");</script>
<script src="/affiliate-config.js" async></script>
<script src="/ads.js" async></script>
</head>
<body>
<div id="wib-nav-placeholder"></div>

<div class="content" id="pageContent"><div class="skeleton" style="height:300px;margin-bottom:16px"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="skeleton" style="height:120px"></div><div class="skeleton" style="height:120px"></div><div class="skeleton" style="height:120px"></div><div class="skeleton" style="height:120px"></div></div></div>
<div id="wib-footer-placeholder"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js" defer></script>
<script src="/config.js"></script>
<script src="/components.js?v=20260505a"></script>
<script src="/polish.js?v=20260419" defer></script>
<script src="/cookie-consent.js" defer></script>
<script src="/widgets.js" defer></script>
<script src="/sanitize.js"></script>
<script>
const db=initFirebase();
let selectedRating=0;

async function load(){
  const id=new URLSearchParams(window.location.search).get('id');
  if(!id){document.getElementById('pageContent').innerHTML='<div class="loading">Product not found. <a href="/electronics" style="color:var(--accent)">Browse all electronics</a></div>';return}
  try{
    const doc=await db.collection('electronics').doc(id).get();
    if(!doc.exists){document.getElementById('pageContent').innerHTML='<div class="loading">Product not found. <a href="/electronics" style="color:var(--accent)">Browse all electronics</a></div>';return}
    const p=doc.data();
    const name=p.name||'Product Details';
    document.title=name+' — WIB';
    document.querySelector('meta[name="description"]').setAttribute('content','Compare specs, price, and reviews for '+name+' on WIB.');
    const canonicalUrl='https://wibest.in/electronics-detail.html?id='+id;
    document.querySelector('link[rel="canonical"]').setAttribute('href',canonicalUrl);
    // JSON-LD Product schema
    const jsonLd={'@context':'https://schema.org','@type':'Product','name':name,'description':p.description||name,'brand':{'@type':'Brand','name':p.brand||''}};
    if(p.price) jsonLd['offers']={'@type':'Offer','price':p.price,'priceCurrency':'INR','availability':'https://schema.org/InStock'};
    if(p.rating) jsonLd['aggregateRating']={'@type':'AggregateRating','ratingValue':p.rating,'bestRating':5,'ratingCount':p.reviews_count||1};
    const ldScript=document.createElement('script');ldScript.type='application/ld+json';ldScript.text=JSON.stringify(jsonLd);document.head.appendChild(ldScript);
    const bcScript=document.createElement('script');bcScript.type='application/ld+json';bcScript.text=JSON.stringify({'@context':'https://schema.org','@type':'BreadcrumbList','itemListElement':[{'@type':'ListItem','position':1,'name':'Home','item':'https://wibest.in'},{'@type':'ListItem','position':2,'name':'Electronics','item':'https://wibest.in/electronics/'},{'@type':'ListItem','position':3,'name':name,'item':canonicalUrl}]});document.head.appendChild(bcScript);
    render(id,p);
  }catch(err){console.error(err);document.getElementById('pageContent').innerHTML='<div class="loading">Error loading product. Please refresh.</div>'}
}

function render(id,p){
  const isPhone=p.subcategory==='phone';
  const eName=(p.name||'').replace(/'/g,'');
  const specs=isPhone?[
    {l:'Display',v:p.display},{l:'Processor',v:p.processor},{l:'RAM',v:p.ram},{l:'Storage',v:p.storage},
    {l:'Camera',v:p.camera},{l:'Battery',v:p.battery},{l:'OS',v:p.os},{l:'Weight',v:p.weight}
  ]:[
    {l:'Display',v:p.display},{l:'Processor',v:p.processor},{l:'RAM',v:p.ram},{l:'Storage',v:p.storage},
    {l:'Graphics',v:p.graphics},{l:'Battery',v:p.battery},{l:'OS',v:p.os},{l:'Weight',v:p.weight}
  ];

  document.getElementById('pageContent').innerHTML=`
  <div class="breadcrumb"><a href="/electronics">Electronics</a> / ${isPhone?'Phones':'Laptops'} / ${p.name}</div>
  <div class="detail-grid"><div class="main-col">
    <div class="hero-card">
      <h1 class="product-name">${p.name}</h1>
      <div class="product-price">₹${(p.price||0).toLocaleString('en-IN')}</div>
      <div class="badges">
        <span class="badge brand">${p.brand||''}</span>
        <span class="badge">${isPhone?'Phone':'Laptop'}</span>
        ${p.year?`<span class="badge">${p.year}</span>`:''}
        ${p.rating?`<span class="badge rating">★ ${p.rating.toFixed(1)}</span>`:''}
      </div>
      ${p.description?`<p class="desc">${p.description}</p>`:''}
    </div>

    <div class="section">
      <div class="section-title">Full Specifications</div>
      <div class="specs-grid">
        ${specs.map(s=>`<div class="spec-item"><div class="spec-label">${s.l}</div><div class="spec-value">${s.v||'N/A'}</div></div>`).join('')}
      </div>
    </div>

    <div class="section">
      <div class="section-title">User Reviews</div>
      <div id="reviewsList"><div class="review-empty">No reviews yet. Be the first to share your experience.</div></div>
      <div class="review-form">
        <h4>Write a Review</h4>
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">No login required. Your review will appear after admin approval.</p>
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">Your rating</div>
        <div class="star-select">${[1,2,3,4,5].map(i=>`<button onclick="selectStar(${i})" id="star${i}">&#9733;</button>`).join('')}</div>
        <div class="rf-row"><input type="text" id="revName" placeholder="Your name"><input type="email" id="revEmail" placeholder="Your email"></div>
        <div class="rf-row"><textarea id="revText" placeholder="Share your experience with this product..."></textarea></div>
        <button class="btn-primary" style="width:100%" onclick="submitReview('${id}','${eName}')">Submit Review</button>
        <div id="reviewMsg" style="display:none"></div>
      </div>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-card">
      <div class="sidebar-title">Key Specs</div>
      <div class="key-specs">
        <div class="key-spec"><span class="label">Brand</span><span class="value">${p.brand||'N/A'}</span></div>
        <div class="key-spec"><span class="label">Price</span><span class="value">₹${(p.price||0).toLocaleString('en-IN')}</span></div>
        <div class="key-spec"><span class="label">${isPhone?'Camera':'Graphics'}</span><span class="value">${isPhone?(p.camera||'N/A'):(p.graphics||'N/A')}</span></div>
        <div class="key-spec"><span class="label">Battery</span><span class="value">${p.battery||'N/A'}</span></div>
        <div class="key-spec"><span class="label">Rating</span><span class="value">${p.rating?'★ '+p.rating.toFixed(1):'N/A'}</span></div>
        ${p.reviews_count?`<div class="key-spec"><span class="label">Reviews</span><span class="value">${p.reviews_count.toLocaleString()}</span></div>`:''}
      </div>
    </div>

    <div class="sidebar-card" style="background:linear-gradient(135deg,var(--bg-card),var(--bg-secondary))">
      <div class="sidebar-title">Buy This Product</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <a href="https://www.amazon.in/s?k=${encodeURIComponent(p.name)}&tag=wib04-21" target="_blank" rel="noopener sponsored" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;background:#ff9900;color:#111;border-radius:8px;font-size:14px;font-weight:700;text-decoration:none">Check Price on Amazon</a>
        <a href="https://www.flipkart.com/search?q=${encodeURIComponent(p.name)}" target="_blank" rel="noopener sponsored" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;background:#2874f0;color:#fff;border-radius:8px;font-size:14px;font-weight:700;text-decoration:none">Check Price on Flipkart</a>
      </div>
      <p style="font-size:11px;color:var(--text-muted);margin-top:8px;text-align:center">Price checked ${new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})} \u00B7 Affiliate links</p>
    </div>

    <div class="sidebar-card">
      <div class="sidebar-title">Quick Actions</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <a href="/compare?type=electronics&id=${id}" style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg-secondary);border-radius:8px;font-size:13px;font-weight:500">Compare with other products</a>
        <a href="/electronics" style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg-secondary);border-radius:8px;font-size:13px;font-weight:500">Back to all electronics</a>
      </div>
    </div>
    <div class="sidebar-card"><div class="sidebar-title">Share</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <a id="shareWA" href="#" target="_blank" rel="noopener" style="padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;background:#25D366;color:#fff;text-decoration:none">WhatsApp</a>
        <a id="shareTW" href="#" target="_blank" rel="noopener" style="padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;background:#1DA1F2;color:#fff;text-decoration:none">Twitter</a>
        <button onclick="copyPageLink()" id="copyBtn" style="padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;background:var(--bg-secondary);border:1px solid var(--border);cursor:pointer">Copy Link</button>
      </div>
    </div>
  </div></div>`;

  // Sticky buy bar
  if(!document.getElementById('stickyBuy')){
    const sb=document.createElement('div');sb.id='stickyBuy';sb.className='sticky-buy';
    sb.innerHTML=`<span class="sb-name">${p.name}</span><span class="sb-price">\u20B9${(p.price||0).toLocaleString('en-IN')}</span><span style="font-size:11px;color:var(--text-muted)">Price checked ${new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</span><div class="sb-btns"><a href="https://www.amazon.in/s?k=${encodeURIComponent(p.name)}&tag=wib04-21" target="_blank" rel="noopener sponsored" class="sb-btn sb-amazon">Amazon</a><a href="https://www.flipkart.com/search?q=${encodeURIComponent(p.name)}" target="_blank" rel="noopener sponsored" class="sb-btn sb-flipkart">Flipkart</a></div>`;
    document.body.appendChild(sb);
    window.addEventListener('scroll',function(){var h=document.querySelector('.hero-card');if(!h)return;var r=h.getBoundingClientRect();sb.classList.toggle('visible',r.bottom<0)});
  }

  const _cu=encodeURIComponent('https://wibest.in/electronics-detail.html?id='+id);
  const _ct=encodeURIComponent((p.name||'Product')+' — WIB');
  document.getElementById('shareWA').href='https://wa.me/?text='+_ct+'%20'+_cu;
  document.getElementById('shareTW').href='https://twitter.com/intent/tweet?text='+_ct+'&url='+_cu+'&via=wibest_in';
  loadReviews(id);
}

function copyPageLink(){var b=document.getElementById('copyBtn');navigator.clipboard.writeText(window.location.href).then(function(){b.textContent='Copied!';setTimeout(function(){b.textContent='Copy Link';},2000);});}

function selectStar(n){selectedRating=n;for(let i=1;i<=5;i++){document.getElementById('star'+i).classList.toggle('active',i<=n)}}

async function submitReview(pId,pName){
  const msg=document.getElementById('reviewMsg');
  if(!checkRateLimit('review',30000)){msg.className='form-msg error';msg.textContent='Please wait before submitting another review.';msg.style.display='block';return}
  const v=validateReview(document.getElementById('revName').value,document.getElementById('revEmail').value,document.getElementById('revText').value,selectedRating);
  if(!v.ok){msg.className='form-msg error';msg.textContent=v.error;msg.style.display='block';return}
  try{
    await db.collection('reviews').add({schoolId:pId,schoolName:pName,name:v.name,email:v.email,text:v.text,rating:v.rating,type:'user',status:'pending',category:'electronics',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    msg.className='form-msg success';msg.textContent='Review submitted. It will appear after admin approval.';msg.style.display='block';
    document.getElementById('revName').value='';document.getElementById('revEmail').value='';document.getElementById('revText').value='';
    selectedRating=0;document.querySelectorAll('.star-select button').forEach(b=>b.classList.remove('active'));
  }catch(e){msg.className='form-msg error';msg.textContent='Failed to submit. Try again.';msg.style.display='block'}
}

async function loadReviews(pId){
  try{
    const snap=await db.collection('reviews').where('schoolId','==',pId).where('status','==','approved').get();
    let html='';
    snap.forEach(doc=>{const r=doc.data();
      html+=`<div class="review-item"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-weight:600;font-size:14px">${escapeHtml(r.name||'Anonymous')}</span><span style="color:var(--green);font-weight:600;font-size:13px">${'★'.repeat(r.rating||0)}${'☆'.repeat(5-(r.rating||0))}</span></div><div style="font-size:13px;color:var(--text-secondary)">${escapeHtml(r.text||'')}</div></div>`;
    });
    if(html)document.getElementById('reviewsList').innerHTML=html;
  }catch(e){console.error(e)}
}

load();
</script>
<script src="/chat-widget.js"></script>
<script src="/affiliate-autoconvert.js?v=20260421b" defer></script>
</body>
</html>
