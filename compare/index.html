<style>
.page{max-width:1200px;margin:calc(var(--nav-height)+var(--cat-height)+32px) auto 60px;padding:0 24px}
.page h1{font-family:'Outfit',sans-serif;font-size:28px;font-weight:700;margin-bottom:8px}
.page p.intro{color:var(--text-secondary);font-size:15px;margin-bottom:24px}
.tab-row{display:flex;gap:8px;margin-bottom:24px}
.tab-btn{padding:10px 24px;border-radius:8px;font-family:inherit;font-size:14px;font-weight:600;border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);cursor:pointer;transition:all .2s}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab-btn:hover:not(.active){background:var(--tag-bg)}
.selector{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.sel-group{flex:1;min-width:250px}
.sel-group label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:block}
.sel-group select{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text-primary);font-family:inherit;font-size:14px;appearance:none;cursor:pointer}
.sel-group select:focus{outline:none;border-color:var(--accent)}
.compare-table{width:100%;border-collapse:collapse;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.compare-table th{padding:14px 16px;text-align:left;background:var(--bg-secondary);font-size:13px;font-weight:600;border-bottom:1px solid var(--border)}
.compare-table td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px}
.compare-table tr:last-child td{border-bottom:none}
.compare-table .label{color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;width:160px}
.highlight{color:var(--green);font-weight:600}
.empty-state{text-align:center;padding:60px;color:var(--text-muted);background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius)}
@media(max-width:768px){.selector{flex-direction:column}.compare-table{font-size:13px}.compare-table .label{width:100px}}
</style>

<body>
<div id="wib-nav-placeholder"></div>

<div class="page">
  <h1>Compare Side by Side</h1>
  <p class="intro">Select 2 or 3 items to compare every detail on one screen.</p>
  <div class="tab-row">
    <button class="tab-btn active" onclick="switchTab('schools',this)">Schools</button>
    <button class="tab-btn" onclick="switchTab('colleges',this)">Colleges</button>
    <button class="tab-btn" onclick="switchTab('electronics',this)">Electronics</button>
    <button class="tab-btn" onclick="switchTab('cars',this)">Cars & Bikes</button>
    <button class="tab-btn" onclick="switchTab('hospitals',this)">Hospitals</button>
  </div>
  <div class="selector" id="selector"></div>
  <div id="compareResult"><div class="empty-state">Select items above to compare them side by side.</div></div>
</div>
<div id="wib-footer-placeholder"></div>


<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js" defer></script>
<script src="/config.js"></script>
<script src="/components.js?v=20260505a"></script>
<script src="/polish.js?v=20260419" defer></script>
<script src="/cookie-consent.js" defer></script>
<script>
const db=initFirebase();
let dataCache={schools:[],colleges:[],electronics:[],cars:[],hospitals:[]};
let currentTab='schools';

async function loadData(){
  // Schools
  const s1=await db.collection('items').get();
  s1.forEach(doc=>{const d=doc.data();if(d.category!=='college'&&!d.stream)dataCache.schools.push({id:doc.id,...d})});
  // Colleges
  const s2=await db.collection('colleges').get();
  s2.forEach(doc=>{dataCache.colleges.push({id:doc.id,...doc.data()})});
  const s3=await db.collection('items').where('category','==','college').get();
  s3.forEach(doc=>{if(!dataCache.colleges.find(c=>c.id===doc.id))dataCache.colleges.push({id:doc.id,...doc.data()})});
  // Electronics
  try{const s4=await db.collection('electronics').get();s4.forEach(doc=>{dataCache.electronics.push({id:doc.id,...doc.data()})})}catch(e){}
  // Cars & Bikes
  try{const s5=await db.collection('vehicles').get();s5.forEach(doc=>{dataCache.cars.push({id:doc.id,...doc.data()})})}catch(e){}
  // Hospitals
  try{const s6=await db.collection('hospitals').get();s6.forEach(doc=>{dataCache.hospitals.push({id:doc.id,...doc.data()})})}catch(e){}
  buildSelectors();
}

function switchTab(tab,btn){
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  buildSelectors();
  document.getElementById('compareResult').innerHTML='<div class="empty-state">Select items above to compare them side by side.</div>';
}

function buildSelectors(){
  const data=dataCache[currentTab]||[];
  const names=data.map(d=>d.name).sort();
  let html='';
  for(let i=1;i<=3;i++){
    html+=`<div class="sel-group"><label>${i===3?'Item 3 (optional)':'Item '+i}</label><select id="sel${i}" onchange="doCompare()"><option value="">Select...</option>${names.map(n=>`<option value="${n}">${n}</option>`).join('')}</select></div>`;
  }
  document.getElementById('selector').innerHTML=html;
}

function doCompare(){
  const data=dataCache[currentTab]||[];
  const selected=[];
  for(let i=1;i<=3;i++){const v=document.getElementById('sel'+i).value;if(v){const item=data.find(d=>d.name===v);if(item)selected.push(item)}}
  if(selected.length<2){document.getElementById('compareResult').innerHTML='<div class="empty-state">Select at least 2 items to compare.</div>';return}

  let rows=[];
  if(currentTab==='schools'){
    rows=[['City','city'],['Board','board'],['Type','type'],['Established','established'],['Annual Fees','fees',v=>typeof v==='object'?(v.tuition||v.annual||0):v,v=>'₹'+(v||0).toLocaleString('en-IN')],['Board Results','board_results'],['S:T Ratio','student_teacher_ratio'],['Google Rating','google_rating',null,v=>v?v.toFixed(1):'N/A'],['Transport','facilities.transport',v=>v?'Yes':'No'],['Sports','facilities.sports',v=>v?'Yes':'No'],['Library','facilities.library',v=>v?'Yes':'No'],['Lab','facilities.science_lab',v=>v?'Yes':'No']];
  }else if(currentTab==='colleges'){
    rows=[['City','city'],['Stream','stream'],['Type','type'],['Accreditation','accreditation'],['Established','established'],['Annual Fees','fees',null,v=>'₹'+(v||0).toLocaleString('en-IN')],['Placement %','placement_percent',null,v=>v?v+'%':'N/A'],['Avg Package','avg_package',null,v=>v?'₹'+(v/100000).toFixed(1)+'L':'N/A'],['Highest Package','highest_package',null,v=>v?'₹'+(v/100000).toFixed(1)+'L':'N/A'],['Google Rating','google_rating',null,v=>v?v.toFixed(1):'N/A'],['Courses','courses',null,v=>Array.isArray(v)?v.join(', '):(v||'N/A')]];
  }else if(currentTab==='cars'){
    rows=[['Brand','brand'],['Price','price',null,v=>v?'₹'+(v/100000).toFixed(1)+'L':'N/A'],['Type','vehicle_type'],['Fuel','fuel'],['Engine','engine'],['Power','power'],['Mileage','mileage'],['Transmission','transmission'],['Seating','seating'],['Rating','rating',null,v=>v?v.toFixed(1):'N/A']];
  }else if(currentTab==='hospitals'){
    rows=[['City','city'],['Type','type'],['Specialties','specialties',null,v=>Array.isArray(v)?v.slice(0,3).join(', '):(v||'N/A')],['Beds','beds'],['Emergency','emergency_24x7',null,v=>v?'Yes':'No'],['Insurance','insurance',null,v=>v?'Yes':'No'],['NABH','nabh_accredited',null,v=>v?'Yes':'No'],['Rating','google_rating',null,v=>v?v.toFixed(1):'N/A']];
  }else{
    rows=[['Brand','brand'],['Price','price',null,v=>'₹'+(v||0).toLocaleString('en-IN')],['Display','display'],['Processor','processor'],['RAM','ram'],['Storage','storage'],['Camera/Graphics','camera||graphics'],['Battery','battery'],['OS','os'],['Rating','rating',null,v=>v?v.toFixed(1):'N/A'],['Weight','weight']];
  }

  let tableHtml=`<table class="compare-table"><thead><tr><th></th>${selected.map(s=>`<th>${s.name}</th>`).join('')}</tr></thead><tbody>`;
  rows.forEach(([label,key,extract,format])=>{
    tableHtml+=`<tr><td class="label">${label}</td>`;
    selected.forEach(s=>{
      let val;
      if(key.includes('.')){const parts=key.split('.');val=s;parts.forEach(p=>{val=val?val[p]:undefined})}
      else if(key.includes('||')){const keys=key.split('||');for(const k of keys){if(s[k]){val=s[k];break}}}
      else{val=s[key]}
      if(extract)val=extract(val);
      const display=format?format(val):(val||'N/A');
      tableHtml+=`<td>${display}</td>`;
    });
    tableHtml+=`</tr>`;
  });
  tableHtml+=`</tbody></table>`;
  document.getElementById('compareResult').innerHTML=tableHtml;
}

loadData();
</script>
<script src="/chat-widget.js"></script>
</body>
</html>
