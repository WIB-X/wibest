<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seed Hindi Blogs — WIB Admin</title>
<meta name="robots" content="noindex,nofollow">
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;background:#0b0f17;color:#e5e7eb}
h1{color:#60a5fa}
button{background:#2563eb;color:#fff;border:0;padding:12px 24px;font-size:16px;border-radius:8px;cursor:pointer;margin:8px 4px}
button:hover{background:#1d4ed8}
button:disabled{background:#374151;cursor:not-allowed}
#log{background:#111827;border:1px solid #1f2937;border-radius:8px;padding:16px;margin-top:20px;max-height:500px;overflow:auto;font-family:ui-monospace,monospace;font-size:13px;white-space:pre-wrap}
.ok{color:#10b981}.err{color:#ef4444}
.warn{background:#7c2d12;color:#fed7aa;padding:12px;border-radius:8px;margin:16px 0}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js" defer></script>
<script src="/config.js"></script>
<script src="/admin-auth-gate.js"></script>
</head>
<body>
<h1>WIB Hindi Seeder</h1>
<p>Seeds the 10 Hindi-translated blog posts into Firestore.</p>
<div class="warn">⚠️ Set <code>allow write: if true;</code> on <code>/blog_posts</code> temporarily.</div>
<button id="seedBtn" onclick="seedAll()">🚀 Seed 10 Hindi Blogs</button>
<div id="log"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js" defer></script>
<script>var BLOG_POSTS = {};</script>
<script src="/seed-data-hindi.js"></script>
<script>
const db = initFirebase();
const log = document.getElementById('log');
function l(m,c){var d=document.createElement('div');d.textContent=m;if(c)d.className=c;log.appendChild(d);log.scrollTop=log.scrollHeight;}
async function seedAll(){
  const btn=document.getElementById('seedBtn');btn.disabled=true;log.textContent='';
  const slugs=Object.keys(BLOG_POSTS);
  l('Seeding '+slugs.length+' Hindi posts...');
  let ok=0,err=0;
  for(const slug of slugs){
    try{
      const data=BLOG_POSTS[slug];
      data.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
      data.publishedAt=firebase.firestore.Timestamp.fromDate(new Date(data.date||'2025-07-01'));
      data.lang='hi';
      await db.collection('blog_posts').doc(slug).set(data,{merge:false});
      l('✓ '+slug,'ok');ok++;
    }catch(e){l('✗ '+slug+': '+e.message,'err');err++;}
  }
  l('\nDone. '+ok+' ok, '+err+' failed.', err?'err':'ok');
  btn.disabled=false;
}
</script>
</body>
</html>
