<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seed Vernacular Blogs (30 posts: Kannada + Malayalam + Bengali) — WIB Admin</title>
<meta name="robots" content="noindex,nofollow">
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;background:#0b0f17;color:#e5e7eb}
h1{color:#60a5fa}
button{background:#2563eb;color:#fff;border:0;padding:12px 24px;font-size:16px;border-radius:8px;cursor:pointer;margin:6px 4px}
button:hover{background:#1d4ed8}
button:disabled{background:#374151;cursor:not-allowed}
#log{background:#111827;border:1px solid #1f2937;border-radius:8px;padding:16px;margin-top:20px;max-height:600px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap}
.ok{color:#10b981}.err{color:#ef4444}
.warn{background:#7c2d12;color:#fed7aa;padding:12px;border-radius:8px;margin:16px 0}
.stat{display:inline-block;background:#1f2937;padding:8px 14px;border-radius:8px;margin:4px;font-family:ui-monospace,monospace}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js" defer></script>
<script src="/config.js"></script>
<script src="/admin-auth-gate.js"></script>
</head>
<body>
<h1>WIB Vernacular Blog Seeder (Kannada + Malayalam + Bengali)</h1>
<p>Seeds 30 vernacular blog posts (10 each in Kannada, Malayalam, Bengali) into Firestore. Same 10 topics as existing Tamil/Telugu sets.</p>
<div class="warn">⚠️ Set <code>allow write: if true;</code> on <code>/blog_posts</code> temporarily. <strong>REVERT to <code>isAdmin()</code> right after seeding.</strong></div>
<div id="counts"></div>
<button onclick="seedAll()">🚀 Seed Everything (30 posts)</button>
<button onclick="seedSet('kn')">Seed Kannada (10)</button>
<button onclick="seedSet('ml')">Seed Malayalam (10)</button>
<button onclick="seedSet('bn')">Seed Bengali (10)</button>
<div id="log"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js" defer></script>
<script>var BLOG_POSTS = {}; var KN_KEYS, ML_KEYS, BN_KEYS;</script>
<script src="/seed-data-kannada.js"></script>
<script>KN_KEYS = new Set(Object.keys(BLOG_POSTS));</script>
<script src="/seed-data-malayalam.js"></script>
<script>ML_KEYS = new Set([...Object.keys(BLOG_POSTS)].filter(k => !KN_KEYS.has(k)));</script>
<script src="/seed-data-bengali.js"></script>
<script>BN_KEYS = new Set([...Object.keys(BLOG_POSTS)].filter(k => !KN_KEYS.has(k) && !ML_KEYS.has(k)));</script>
<script>
const db = initFirebase();
const log = document.getElementById('log');
function l(m,c){var d=document.createElement('div');d.textContent=m;if(c)d.className=c;log.appendChild(d);log.scrollTop=log.scrollHeight;}
document.getElementById('counts').innerHTML =
  '<span class="stat">Kannada: '+KN_KEYS.size+'</span>'+
  '<span class="stat">Malayalam: '+ML_KEYS.size+'</span>'+
  '<span class="stat">Bengali: '+BN_KEYS.size+'</span>'+
  '<span class="stat">Total: '+Object.keys(BLOG_POSTS).length+'</span>';

async function seedSubset(slugs, label){
  l('--- Seeding '+slugs.length+' '+label+' posts ---');
  let ok=0, err=0;
  for(const slug of slugs){
    try{
      const data = BLOG_POSTS[slug];
      data.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
      data.publishedAt = firebase.firestore.Timestamp.fromDate(new Date(data.date||'2026-04-20'));
      await db.collection('blog_posts').doc(slug).set(data, {merge:false});
      l('OK '+slug, 'ok'); ok++;
    }catch(e){l('FAIL '+slug+': '+e.message,'err'); err++;}
  }
  l('=== '+label+' done: '+ok+' ok, '+err+' failed ===', err?'err':'ok');
}
function seedSet(lang){
  if(lang==='kn') return seedSubset([...KN_KEYS],'Kannada');
  if(lang==='ml') return seedSubset([...ML_KEYS],'Malayalam');
  if(lang==='bn') return seedSubset([...BN_KEYS],'Bengali');
}
async function seedAll(){
  await seedSubset([...KN_KEYS],'Kannada');
  await seedSubset([...ML_KEYS],'Malayalam');
  await seedSubset([...BN_KEYS],'Bengali');
  l('\n🎉 ALL 30 VERNACULAR POSTS SEEDED');
}
</script>
</body>
</html>
