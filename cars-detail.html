<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Details — WIB</title>
<meta name="description" content="Compare specs, price, mileage, and reviews for this vehicle on WIB — India's comparison platform.">
<meta property="og:site_name" content="WIB">
<meta property="og:type" content="website">
<meta property="og:image" content="https://wibest.in/og-default.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@wibest_in">
<link rel="canonical" href="https://wibest.in/cars-detail.html">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32"><link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/polish.css">
<style>
.content{max-width:1200px;margin:calc(var(--nav-height)+var(--cat-height)+24px) auto 60px;padding:0 24px}
.breadcrumb{font-size:13px;color:var(--text-muted);margin-bottom:20px}.breadcrumb a{color:var(--accent)}
.detail-grid{display:grid;grid-template-columns:1fr 360px;gap:24px}
.hero-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:32px;transition:background .3s}
.v-name{font-family:'Outfit',sans-serif;font-size:28px;font-weight:700;letter-spacing:-0.02em;margin-bottom:4px}
.v-price{font-family:'Outfit',sans-serif;font-size:24px;font-weight:700;color:var(--accent);margin-bottom:12px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.badge{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;background:var(--tag-bg);color:var(--tag-text)}
.badge.brand{background:var(--accent-light);color:var(--accent)}
.badge.rating{background:var(--green-bg);color:var(--green)}
.desc{color:var(--text-secondary);font-size:14px;line-height:1.7}
.section{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-top:20px;transition:background .3s}
.section-title{font-family:'Outfit',sans-serif;font-size:18px;font-weight:600;margin-bottom:16px}
.specs-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.spec-item{padding:14px 16px;background:var(--bg-secondary);border-radius:8px}
.spec-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.spec-value{font-size:14px;font-weight:600}
.review-form{background:var(--bg-secondary);border-radius:8px;padding:20px;margin-top:16px}
.review-form h4{font-size:15px;font-weight:600;margin-bottom:12px}
.rf-row{display:flex;gap:12px;margin-bottom:12px}
.rf-row input,.rf-row textarea{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text-primary);font-family:inherit;font-size:14px}
.rf-row input:focus,.rf-row textarea:focus{outline:none;border-color:var(--accent)}
.rf-row textarea{resize:vertical;min-height:70px}
.star-select{display:flex;gap:4px;margin-bottom:12px}
.star-select button{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--bg-card);cursor:pointer;font-size:16px;color:var(--text-muted);transition:all .2s}
.star-select button.active{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.form-msg{font-size:13px;text-align:center;padding:8px;border-radius:6px;margin-top:8px}
.form-msg.success{background:var(--green-bg);color:var(--green)}
.form-msg.error{background:#fef2f2;color:var(--red)}
.review-empty{color:var(--text-muted);font-size:14px;padding:16px;text-align:center;background:var(--bg-secondary);border-radius:8px}
.review-item{padding:14px;background:var(--bg-secondary);border-radius:8px;margin-bottom:8px}
.sidebar{display:flex;flex-direction:column;gap:20px}
.sidebar-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;transition:background .3s}
.sidebar-title{font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;margin-bottom:12px}
.key-specs{display:flex;flex-direction:column;gap:10px}
.key-spec{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}.key-spec:last-child{border-bottom:none}
.key-spec .label{font-size:13px;color:var(--text-secondary)}.key-spec .value{font-size:13px;font-weight:600}
.loading{text-align:center;padding:100px 24px;color:var(--text-muted)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.detail-grid{grid-template-columns:1fr}.specs-grid{grid-template-columns:1fr}.v-name{font-size:22px}.rf-row{flex-direction:column}}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JBXR43H9PE"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-JBXR43H9PE");</script>
<script src="/affiliate-config.js" async></script>
<script src="/ads.js" async></script>
</head>
<body>
<div id="wib-nav-placeholder"></div>

<div class="content" id="pageContent"><div class="skeleton" style="height:300px;margin-bottom:16px"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="skeleton" style="height:120px"></div><div class="skeleton" style="height:120px"></div><div class="skeleton" style="height:120px"></div><div class="skeleton" style="height:120px"></div></div></div>
<div id="wib-footer-placeholder"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="/config.js"></script>
<script src="/components.js"></script>
<script src="/polish.js" defer></script>
<script src="/cookie-consent.js" defer></script>
<script src="/widgets.js" defer></script>
<script src="/sanitize.js"></script>
<script>
const db=initFirebase();let selectedRating=0;
function formatPrice(p){if(!p)return'N/A';if(p>=10000000)return'₹'+(p/10000000).toFixed(2)+' Cr';if(p>=100000)return'₹'+(p/100000).toFixed(1)+' L';return'₹'+p.toLocaleString('en-IN')}

async function load(){
  const id=new URLSearchParams(window.location.search).get('id');
  if(!id){document.getElementById('pageContent').innerHTML='<div class="loading">Vehicle not found. <a href="/cars" style="color:var(--accent)">Browse all cars & bikes</a></div>';return}
  try{
    const doc=await db.collection('vehicles').doc(id).get();
    if(!doc.exists){document.getElementById('pageContent').innerHTML='<div class="loading">Vehicle not found. <a href="/cars" style="color:var(--accent)">Browse all cars & bikes</a></div>';return}
    const v=doc.data();
    const name=v.name||'Vehicle Details';
    document.title=name+' — WIB';
    document.querySelector('meta[name="description"]').setAttribute('content','Compare specs, price, and reviews for '+name+' on WIB.');
    const canonicalUrl='https://wibest.in/cars-detail.html?id='+id;
    document.querySelector('link[rel="canonical"]').setAttribute('href',canonicalUrl);
    // JSON-LD Product schema
    const jsonLd={'@context':'https://schema.org','@type':'Product','name':name,'description':v.description||name,'brand':{'@type':'Brand','name':v.brand||''}};
    if(v.price) jsonLd['offers']={'@type':'Offer','price':v.price,'priceCurrency':'INR','availability':'https://schema.org/InStock'};
    if(v.rating) jsonLd['aggregateRating']={'@type':'AggregateRating','ratingValue':v.rating,'bestRating':5,'ratingCount':v.reviews_count||1};
    const ldScript=document.createElement('script');ldScript.type='application/ld+json';ldScript.text=JSON.stringify(jsonLd);document.head.appendChild(ldScript);
    const bcScript=document.createElement('script');bcScript.type='application/ld+json';bcScript.text=JSON.stringify({'@context':'https://schema.org','@type':'BreadcrumbList','itemListElement':[{'@type':'ListItem','position':1,'name':'Home','item':'https://wibest.in'},{'@type':'ListItem','position':2,'name':'Cars & Bikes','item':'https://wibest.in/cars/'},{'@type':'ListItem','position':3,'name':name,'item':canonicalUrl}]});document.head.appendChild(bcScript);
    render(id,v);
  }catch(err){console.error(err);document.getElementById('pageContent').innerHTML='<div class="loading">Error loading. Please refresh.</div>'}
}

function render(id,v){
  const isCar=v.subcategory==='car';const eName=(v.name||'').replace(/'/g,'');
  const specs=isCar?[
    {l:'Engine',v:v.engine},{l:'Power',v:v.power},{l:'Torque',v:v.torque},{l:'Transmission',v:v.transmission},
    {l:'Fuel Type',v:v.fuel},{l:'Mileage',v:v.mileage},{l:'Seating',v:v.seating},{l:'Boot Space',v:v.boot_space},
    {l:'Ground Clearance',v:v.ground_clearance},{l:'Kerb Weight',v:v.kerb_weight}
  ]:[
    {l:'Engine',v:v.engine},{l:'Power',v:v.power},{l:'Torque',v:v.torque},{l:'Transmission',v:v.transmission},
    {l:'Fuel Type',v:v.fuel},{l:'Mileage',v:v.mileage},{l:'Type',v:v.bike_type},{l:'Kerb Weight',v:v.kerb_weight},
    {l:'Top Speed',v:v.top_speed},{l:'Brakes',v:v.brakes}
  ];

  document.getElementById('pageContent').innerHTML=`
  <div class="breadcrumb"><a href="/cars">Cars & Bikes</a> / ${v.name}</div>
  <div class="detail-grid"><div class="main-col">
    <div class="hero-card"><h1 class="v-name">${v.name}</h1><div class="v-price">${formatPrice(v.price)}</div>
      <div class="badges"><span class="badge brand">${v.brand||''}</span><span class="badge">${v.vehicle_type||''}</span><span class="badge">${isCar?'Car':'Bike'}</span>${v.fuel?`<span class="badge">${v.fuel}</span>`:''}${v.rating?`<span class="badge rating">★ ${v.rating.toFixed(1)}</span>`:''}</div>
      ${v.description?`<p class="desc">${v.description}</p>`:''}
    </div>
    <div class="section"><div class="section-title">Full Specifications</div>
      <div class="specs-grid">${specs.map(s=>`<div class="spec-item"><div class="spec-label">${s.l}</div><div class="spec-value">${s.v||'N/A'}</div></div>`).join('')}</div>
    </div>
    <div class="section"><div class="section-title">User Reviews</div>
      <div id="reviewsList"><div class="review-empty">No reviews yet. Be the first to share your experience.</div></div>
      <div class="review-form"><h4>Write a Review</h4>
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">No login required. Your review will appear after admin approval.</p>
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">Your rating</div>
        <div class="star-select">${[1,2,3,4,5].map(i=>`<button onclick="selectStar(${i})" id="star${i}">&#9733;</button>`).join('')}</div>
        <div class="rf-row"><input type="text" id="revName" placeholder="Your name"><input type="email" id="revEmail" placeholder="Your email"></div>
        <div class="rf-row"><textarea id="revText" placeholder="Share your experience..."></textarea></div>
        <button class="btn-primary" style="width:100%" onclick="submitReview('${id}','${eName}')">Submit Review</button>
        <div id="reviewMsg" style="display:none"></div>
      </div>
    </div>
  </div>
  <div class="sidebar">
    <div class="sidebar-card"><div class="sidebar-title">Key Specs</div><div class="key-specs">
      <div class="key-spec"><span class="label">Brand</span><span class="value">${v.brand||'N/A'}</span></div>
      <div class="key-spec"><span class="label">Price</span><span class="value">${formatPrice(v.price)}</span></div>
      <div class="key-spec"><span class="label">Engine</span><span class="value">${v.engine||'N/A'}</span></div>
      <div class="key-spec"><span class="label">Mileage</span><span class="value">${v.mileage||'N/A'}</span></div>
      <div class="key-spec"><span class="label">Fuel</span><span class="value">${v.fuel||'N/A'}</span></div>
      <div class="key-spec"><span class="label">Rating</span><span class="value">${v.rating?'★ '+v.rating.toFixed(1):'N/A'}</span></div>
    </div></div>
    <div class="sidebar-card" style="background:linear-gradient(135deg,var(--bg-card),var(--bg-secondary))"><div class="sidebar-title">${v.subcategory==='bike'?'Check This Bike':'Check This Car'}</div><div style="display:flex;flex-direction:column;gap:8px">
      <a href="https://www.cardekho.com/search?q=${encodeURIComponent(v.name)}" target="_blank" rel="noopener sponsored" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;background:#e8272c;color:#fff;border-radius:8px;font-size:14px;font-weight:700;text-decoration:none">View on CarDekho</a>
      <a href="https://www.carwale.com/search/?q=${encodeURIComponent(v.name)}" target="_blank" rel="noopener sponsored" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;background:#00b7ff;color:#fff;border-radius:8px;font-size:14px;font-weight:700;text-decoration:none">View on CarWale</a>
    </div><p style="font-size:11px;color:var(--text-muted);margin-top:8px;text-align:center">Prices are ex-showroom. May vary by city.</p></div>
    <div class="sidebar-card" style="background:linear-gradient(135deg,#fff3e0,#fff8e1)">
      <div class="sidebar-title" style="color:#e65100">Shop Accessories on Amazon</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <a href="https://www.amazon.in/s?k=${encodeURIComponent(v.name)}+accessories&tag=wib04-21" target="_blank" rel="noopener sponsored" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;background:#ff9900;color:#111;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none">${v.subcategory==='bike'?'Bike':'Car'} Accessories</a>
        <a href="https://www.amazon.in/s?k=${encodeURIComponent(v.name)}+seat+cover&tag=wib04-21" target="_blank" rel="noopener sponsored" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;background:#ff9900;color:#111;border-radius:8px;font-size:13px;font-weight:700;text-decoration:none">${v.subcategory==='bike'?'Riding Gear':'Seat Covers'}</a>
        <a href="https://www.amazon.in/s?k=car+phone+holder&tag=wib04-21" target="_blank" rel="noopener sponsored" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;background:var(--bg-card);color:var(--text-primary);border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;text-decoration:none">Phone Holders &amp; Chargers</a>
      </div>
      <p style="font-size:11px;color:var(--text-muted);margin-top:8px;text-align:center">Affiliate links \u00B7 You pay the same price</p>
    </div>
    <div class="sidebar-card"><div class="sidebar-title">Quick Actions</div><div style="display:flex;flex-direction:column;gap:8px">
      <a href="/compare?type=cars" style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg-secondary);border-radius:8px;font-size:13px;font-weight:500">Compare with other vehicles</a>
      <a href="/cars" style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg-secondary);border-radius:8px;font-size:13px;font-weight:500">Back to all cars & bikes</a>
    </div></div>
    <div class="sidebar-card"><div class="sidebar-title">Share</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <a id="shareWA" href="#" target="_blank" rel="noopener" style="padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;background:#25D366;color:#fff;text-decoration:none">WhatsApp</a>
        <a id="shareTW" href="#" target="_blank" rel="noopener" style="padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;background:#1DA1F2;color:#fff;text-decoration:none">Twitter</a>
        <button onclick="copyPageLink()" id="copyBtn" style="padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;background:var(--bg-secondary);border:1px solid var(--border);cursor:pointer">Copy Link</button>
      </div>
    </div>
  </div></div>`;
  const _cu=encodeURIComponent('https://wibest.in/cars-detail.html?id='+id);
  const _ct=encodeURIComponent((v.name||'Vehicle')+' — WIB');
  document.getElementById('shareWA').href='https://wa.me/?text='+_ct+'%20'+_cu;
  document.getElementById('shareTW').href='https://twitter.com/intent/tweet?text='+_ct+'&url='+_cu+'&via=wibest_in';
  loadReviews(id);
}

function copyPageLink(){var b=document.getElementById('copyBtn');navigator.clipboard.writeText(window.location.href).then(function(){b.textContent='Copied!';setTimeout(function(){b.textContent='Copy Link';},2000);});}
function selectStar(n){selectedRating=n;for(let i=1;i<=5;i++){document.getElementById('star'+i).classList.toggle('active',i<=n)}}
async function submitReview(vId,vName){
  const msg=document.getElementById('reviewMsg');
  if(!checkRateLimit('review',30000)){msg.className='form-msg error';msg.textContent='Please wait before submitting another review.';msg.style.display='block';return}
  const v=validateReview(document.getElementById('revName').value,document.getElementById('revEmail').value,document.getElementById('revText').value,selectedRating);
  if(!v.ok){msg.className='form-msg error';msg.textContent=v.error;msg.style.display='block';return}
  try{await db.collection('reviews').add({schoolId:vId,schoolName:vName,name:v.name,email:v.email,text:v.text,rating:v.rating,type:'user',status:'pending',category:'vehicle',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    msg.className='form-msg success';msg.textContent='Review submitted. It will appear after admin approval.';msg.style.display='block';
    document.getElementById('revName').value='';document.getElementById('revEmail').value='';document.getElementById('revText').value='';selectedRating=0;document.querySelectorAll('.star-select button').forEach(b=>b.classList.remove('active'));
  }catch(e){msg.className='form-msg error';msg.textContent='Failed. Try again.';msg.style.display='block'}
}
async function loadReviews(vId){
  try{const snap=await db.collection('reviews').where('schoolId','==',vId).where('status','==','approved').get();
    let html='';snap.forEach(doc=>{const r=doc.data();html+=`<div class="review-item"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-weight:600;font-size:14px">${escapeHtml(r.name||'Anonymous')}</span><span style="color:var(--green);font-weight:600;font-size:13px">${'★'.repeat(r.rating||0)}${'☆'.repeat(5-(r.rating||0))}</span></div><div style="font-size:13px;color:var(--text-secondary)">${escapeHtml(r.text||'')}</div></div>`});
    if(html)document.getElementById('reviewsList').innerHTML=html;
  }catch(e){console.error(e)}
}
load();
</script>
<script src="/chat-widget.js"></script>
</body>
</html>
