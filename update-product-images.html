<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Update Product Images — WIBest Admin</title>
<meta name="robots" content="noindex,nofollow">
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;background:#0b0f17;color:#e5e7eb}
h1{color:#60a5fa}
button{background:#2563eb;color:#fff;border:0;padding:12px 24px;font-size:16px;border-radius:8px;cursor:pointer;margin:6px 4px}
button:hover{background:#1d4ed8}
button:disabled{background:#374151;cursor:not-allowed}
#log{background:#111827;border:1px solid #1f2937;border-radius:8px;padding:16px;margin-top:20px;max-height:600px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap}
.ok{color:#10b981}.err{color:#ef4444}.skip{color:#94a3b8}
.warn{background:#7c2d12;color:#fed7aa;padding:12px;border-radius:8px;margin:16px 0}
</style>
</head>
<body>
<h1>WIBest — Update Product Images</h1>
<p>Matches each electronics product in Firestore with the best image URL from <code>PRODUCT_IMAGES</code> and updates the doc.</p>
<div class="warn">Set <code>allow write: if true;</code> on <code>/items</code> temporarily, then revert to <code>isAdmin()</code>.</div>
<button id="dryRun" onclick="run(true)">Dry-run (preview, no write)</button>
<button id="apply" onclick="run(false)">Apply updates</button>
<div id="log"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="/config.js"></script>
<script>var PRODUCT_IMAGES = {};</script>
<script src="/seed-data-product-images.js"></script>
<script>
const db = initFirebase();
const log = document.getElementById('log');
function l(m,c){var d=document.createElement('div');d.textContent=m;if(c)d.className=c;log.appendChild(d);log.scrollTop=log.scrollHeight;}

function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();}

function findMatch(productName){
  const target = norm(productName);
  if(!target) return null;
  let best = null, bestScore = 0;
  for(const key of Object.keys(PRODUCT_IMAGES)){
    const k = norm(key);
    const tt = target.split(' ');
    const kt = k.split(' ');
    let m = 0;
    for(const w of kt) if(tt.includes(w)) m++;
    const score = m / kt.length;
    if(score > bestScore && score >= 0.6){ bestScore = score; best = key; }
  }
  return best ? { key: best, url: PRODUCT_IMAGES[best], score: bestScore } : null;
}

async function run(dryRun){
  document.getElementById('dryRun').disabled = true;
  document.getElementById('apply').disabled = true;
  log.textContent = '';
  l((dryRun ? 'Dry-run — ' : 'Applying — ') + Object.keys(PRODUCT_IMAGES).length + ' images available', 'skip');

  const snap = await db.collection('items').get();
  let scanned=0, matched=0, updated=0, skipped=0, failed=0;
  const updates = [];

  snap.forEach(doc => {
    const d = doc.data();
    const isElectronics = d.subcategory === 'phone' || d.subcategory === 'laptop' || d.category === 'electronics' || d.category === 'phone' || d.category === 'laptop' || d.processor || d.ram;
    if(!isElectronics) return;
    scanned++;
    if(d.image && d.image.length > 10){ l('skip (has image): ' + d.name, 'skip'); skipped++; return; }
    const m = findMatch(d.name);
    if(!m){ l('? no match: ' + d.name, 'err'); failed++; return; }
    matched++;
    l('OK ' + d.name + ' -> ' + m.key + ' (' + Math.round(m.score*100) + '%)', 'ok');
    if(!dryRun) updates.push({ ref: doc.ref, url: m.url, key: m.key });
  });

  l('--- summary ---');
  l('Scanned: ' + scanned + ' | Matched: ' + matched + ' | Skipped: ' + skipped + ' | No match: ' + failed);

  if(!dryRun && updates.length){
    let ok=0, err=0;
    for(let i=0; i<updates.length; i+=400){
      const slice = updates.slice(i, i+400);
      const batch = db.batch();
      slice.forEach(u => batch.update(u.ref, { image: u.url, imageMatch: u.key, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }));
      try{ await batch.commit(); ok += slice.length; }catch(e){ err += slice.length; l('Batch failed: '+e.message,'err'); }
    }
    l('Wrote ' + ok + ' updates' + (err? ' (' + err + ' failed)':''), err?'err':'ok');
  }
  document.getElementById('dryRun').disabled = false;
  document.getElementById('apply').disabled = false;
}
</script>
</body>
</html>
