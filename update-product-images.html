<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Update Product Images — WIB Admin</title>
<meta name="robots" content="noindex,nofollow">
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;background:#0b0f17;color:#e5e7eb}
h1{color:#60a5fa}
button{background:#2563eb;color:#fff;border:0;padding:12px 24px;font-size:16px;border-radius:8px;cursor:pointer;margin:6px 4px}
button:hover{background:#1d4ed8}
button:disabled{background:#374151;cursor:not-allowed}
#log{background:#111827;border:1px solid #1f2937;border-radius:8px;padding:16px;margin-top:20px;max-height:600px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap}
.ok{color:#10b981}.err{color:#ef4444}.skip{color:#94a3b8}
.warn{background:#7c2d12;color:#fed7aa;padding:12px;border-radius:8px;margin:16px 0}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js" defer></script>
<script src="/config.js"></script>
<script src="/admin-auth-gate.js"></script>
</head>
<body>
<h1>WIB — Update Product Images</h1>
<p>Matches each electronics product in Firestore with the best image URL from <code>PRODUCT_IMAGES</code> and updates the doc.</p>
<div class="warn">Set <code>allow write: if true;</code> on <code>/electronics</code> temporarily, then revert to <code>isAdmin()</code>.</div>
<button id="dryRun" onclick="run(true)">Dry-run (preview, no write)</button>
<button id="apply" onclick="run(false)">Apply updates</button>
<button id="clear" onclick="clearAll()" style="background:#dc2626">Clear all image fields (rollback)</button>
<div id="log"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js" defer></script>
<script>var PRODUCT_IMAGES = {};</script>
<script src="/seed-data-product-images.js"></script>
<script>
const db = initFirebase();
const log = document.getElementById('log');
function l(m,c){var d=document.createElement('div');d.textContent=m;if(c)d.className=c;log.appendChild(d);log.scrollTop=log.scrollHeight;}

function norm(s){return (s||'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();}

// "Significant" tokens: brand-like words and identifiers (model numbers, codes).
// Stop words like 'pro', 'plus', '5g', 'inch', 'edition' don't differentiate models on their own.
const STOP = new Set(['pro','plus','max','ultra','5g','4g','inch','edition','new','india','smartphone','laptop','generation','gen','13','14','15','16','17']);
function sigTokens(s){
  return norm(s).split(' ').filter(t => t.length >= 2);
}

// A match is valid only if:
//  1. Every significant token (model number / brand / unique code) in EITHER name appears in the other.
//  2. They share the brand prefix (first significant token).
function findMatch(productName){
  const tt = sigTokens(productName);
  if(tt.length === 0) return null;
  const targetSet = new Set(tt);

  let best = null, bestScore = 0;
  for(const key of Object.keys(PRODUCT_IMAGES)){
    const kt = sigTokens(key);
    if(kt.length === 0) continue;

    // Brand must match (first significant token of each)
    if(tt[0] !== kt[0]) continue;

    // Every non-stop token in the key must appear in the target — and vice versa
    const keyImportant = kt.filter(t => !STOP.has(t));
    const targetImportant = tt.filter(t => !STOP.has(t));

    let keyOK = true;
    for(const t of keyImportant){ if(!targetSet.has(t)){ keyOK = false; break; } }
    if(!keyOK) continue;

    let targetOK = true;
    const keySet = new Set(kt);
    for(const t of targetImportant){ if(!keySet.has(t)){ targetOK = false; break; } }
    if(!targetOK) continue;

    // Score = how perfectly they overlap on important tokens
    const allImportant = new Set([...keyImportant, ...targetImportant]);
    const intersection = [...allImportant].filter(t => targetSet.has(t) && keySet.has(t)).length;
    const score = intersection / allImportant.size;

    // Require at least 0.85 — practically means full overlap on key tokens
    if(score >= 0.85 && score > bestScore){ bestScore = score; best = key; }
  }
  return best ? { key: best, url: PRODUCT_IMAGES[best], score: bestScore } : null;
}

async function run(dryRun){
  document.getElementById('dryRun').disabled = true;
  document.getElementById('apply').disabled = true;
  log.textContent = '';
  l((dryRun ? 'Dry-run — ' : 'Applying — ') + Object.keys(PRODUCT_IMAGES).length + ' images available', 'skip');

  // Electronics live in their own /electronics collection (not /items)
  const snap = await db.collection('electronics').get();
  let scanned=0, matched=0, updated=0, skipped=0, failed=0;
  const updates = [];

  snap.forEach(doc => {
    const d = doc.data();
    scanned++;
    if(d.image && d.image.length > 10){ l('skip (has image): ' + d.name, 'skip'); skipped++; return; }
    const m = findMatch(d.name);
    if(!m){ l('? no match: ' + d.name, 'err'); failed++; return; }
    matched++;
    l('OK ' + d.name + ' -> ' + m.key + ' (' + Math.round(m.score*100) + '%)', 'ok');
    if(!dryRun) updates.push({ ref: doc.ref, url: m.url, key: m.key });
  });

  l('--- summary ---');
  l('Scanned: ' + scanned + ' | Matched: ' + matched + ' | Skipped: ' + skipped + ' | No match: ' + failed);

  if(!dryRun && updates.length){
    let ok=0, err=0;
    for(let i=0; i<updates.length; i+=400){
      const slice = updates.slice(i, i+400);
      const batch = db.batch();
      slice.forEach(u => batch.update(u.ref, { image: u.url, imageMatch: u.key, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }));
      try{ await batch.commit(); ok += slice.length; }catch(e){ err += slice.length; l('Batch failed: '+e.message,'err'); }
    }
    l('Wrote ' + ok + ' updates' + (err? ' (' + err + ' failed)':''), err?'err':'ok');
  }
  document.getElementById('dryRun').disabled = false;
  document.getElementById('apply').disabled = false;
}

async function clearAll(){
  if(!confirm('Remove image + imageMatch fields from ALL products in /electronics? This is a one-shot rollback.')) return;
  document.getElementById('clear').disabled = true;
  log.textContent = '';
  l('Clearing images on all electronics...', 'skip');
  const snap = await db.collection('electronics').get();
  let n = 0;
  for(let i = 0; i < snap.docs.length; i += 400){
    const slice = snap.docs.slice(i, i+400);
    const batch = db.batch();
    slice.forEach(d => batch.update(d.ref, {
      image: firebase.firestore.FieldValue.delete(),
      imageMatch: firebase.firestore.FieldValue.delete()
    }));
    await batch.commit();
    n += slice.length;
    l('Cleared batch '+(i/400+1)+': '+slice.length, 'skip');
  }
  l('Cleared image fields on '+n+' products', 'ok');
  document.getElementById('clear').disabled = false;
}
</script>
</body>
</html>
