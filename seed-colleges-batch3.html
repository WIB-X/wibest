<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Add Gurugram/Noida/Dehradun Colleges — WIB Admin</title><meta name="robots" content="noindex,nofollow"><style>body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;background:#0b0f17;color:#e5e7eb}h1{color:#60a5fa}button{background:#2563eb;color:#fff;border:0;padding:12px 24px;font-size:16px;border-radius:8px;cursor:pointer;margin:6px 4px}button:hover{background:#1d4ed8}button:disabled{background:#374151}#log{background:#111827;border:1px solid #1f2937;border-radius:8px;padding:16px;margin-top:20px;max-height:500px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap}.ok{color:#10b981}.err{color:#ef4444}.info{color:#60a5fa}.warn{background:#7c2d12;color:#fed7aa;padding:12px;border-radius:8px;margin:16px 0}.stat{display:inline-block;background:#1f2937;padding:8px 14px;border-radius:8px;margin:4px;font-family:ui-monospace,monospace}table{border-collapse:collapse;margin-top:14px;font-size:12px;width:100%}th,td{border:1px solid #1f2937;padding:5px 8px;text-align:left}th{color:#60a5fa}</style><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js" defer></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js" defer></script><script src="/config.js"></script><script src="/admin-auth-gate.js"></script></head><body><h1>Add Colleges — Gurugram, Noida, Dehradun</h1><div class="warn">⚠️ Review first. Fees APPROXIMATE — edit <code>/seed-data-colleges-batch3.js</code>. Ratings blank.</div><div class="warn"><strong>ADDITIVE</strong> — run <strong>once</strong>.</div><div id="counts"></div><button onclick="preview()">👁 Preview</button><button id="addBtn" onclick="add()">➕ Add to Firestore</button><div id="preview"></div><div id="log"></div><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js" defer></script><script src="/seed-data-colleges-batch3.js"></script><script>function l(m,c){const d=document.getElementById('log');const s=document.createElement('div');if(c)s.className=c;s.textContent=m;d.appendChild(s);d.scrollTop=d.scrollHeight;}function normalize(r){return{name:r.name,category:'college',city:r.city,state:r.state||'',board:'',type:r.type||'',stream:r.stream||'',speciality:'',fees:r.fees||0,rating:r.rating||0,established:r.established||0,student_count:0,results:r.results||0,board_results:r.results||0,student_teacher_ratio:'',contact:'',address:r.address||'',website:'',highlights:r.highlights||'',createdAt:firebase.firestore.FieldValue.serverTimestamp()};}function byCity(){const c={};BATCH3_COLLEGES.forEach(s=>c[s.city]=(c[s.city]||0)+1);return c;}function showCounts(){const c=byCity();document.getElementById('counts').innerHTML='<div class="stat">Total: '+BATCH3_COLLEGES.length+'</div>'+Object.keys(c).sort().map(k=>'<div class="stat">'+k+': '+c[k]+'</div>').join('');}function preview(){showCounts();document.getElementById('preview').innerHTML='<table><thead><tr><th>Name</th><th>City</th><th>Stream</th><th>Type</th><th>Fees</th></tr></thead><tbody>'+BATCH3_COLLEGES.map(s=>'<tr><td>'+s.name+'</td><td>'+s.city+'</td><td>'+s.stream+'</td><td>'+s.type+'</td><td>'+(s.fees?('₹'+s.fees.toLocaleString('en-IN')):'—')+'</td></tr>').join('')+'</tbody></table>';l('Preview — '+BATCH3_COLLEGES.length+' colleges.','info');}async function add(){if(typeof firebase==='undefined'||!firebase.firestore){l('Firebase not ready.','err');return;}if(!confirm('Add '+BATCH3_COLLEGES.length+'? Additive. Once.'))return;document.getElementById('addBtn').disabled=true;const db=firebase.firestore();showCounts();l('Adding...','info');let ok=0;const b=db.batch();BATCH3_COLLEGES.forEach(r=>b.set(db.collection('items').doc(),normalize(r)));try{await b.commit();ok=BATCH3_COLLEGES.length;l('✓ '+ok,'ok');}catch(e){l('✗ '+e.message,'err');}l('Done: '+ok+' added',ok?'ok':'err');if(ok)l('Tell Claude "colleges batch3 imported".','info');document.getElementById('addBtn').disabled=false;}window.addEventListener('load',()=>setTimeout(showCounts,500));</script></body></html>
