name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:   # Manual run from Actions tab

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@^13

      - name: Install function dependencies
        run: npm install
        working-directory: functions

      - name: Write functions .env
        run: |
          cat > functions/.env << EOF
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          EMAIL_PASS=${{ secrets.EMAIL_PASS }}
          EMAIL_ADMIN=${{ secrets.EMAIL_ADMIN }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EARNKARO_API_KEY=${{ secrets.EARNKARO_API_KEY }}
          EOF

      - name: Write service account credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then
            printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
            # Sanity-check that it's valid JSON before continuing
            node -e "JSON.parse(require('fs').readFileSync('$RUNNER_TEMP/sa.json','utf8'))" || { echo '::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON. Re-paste it without surrounding quotes.'; exit 1; }
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
            echo "USE_SA=1" >> "$GITHUB_ENV"
            echo "Auth: service account ✓"
          else
            echo "Auth: legacy CI token (FIREBASE_TOKEN)"
          fi

      - name: Deploy Firebase Functions & Firestore Rules
        env:
          # Pass legacy CI token; we'll unset it inside the script if SA is in use.
          LEGACY_FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -o pipefail
          # When service account is configured, FIREBASE_TOKEN must be unset.
          # The CLI prefers FIREBASE_TOKEN if both are present (legacy path),
          # which would cause 401s with an expired/old CI token.
          if [ -n "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            echo "Auth method: service account (GOOGLE_APPLICATION_CREDENTIALS=$GOOGLE_APPLICATION_CREDENTIALS)"
            unset FIREBASE_TOKEN
          else
            echo "Auth method: legacy CI token"
            export FIREBASE_TOKEN="$LEGACY_FIREBASE_TOKEN"
          fi
          firebase deploy --only functions,firestore:rules --project wibest-449fe --non-interactive --force 2>&1 | tee /tmp/deploy.log
          echo "=== Last 80 lines of deploy ==="
          tail -80 /tmp/deploy.log
