name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        run: npm install
        working-directory: functions

      - name: Write functions .env
        run: |
          cat > functions/.env << EOF
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          EMAIL_PASS=${{ secrets.EMAIL_PASS }}
          EMAIL_ADMIN=${{ secrets.EMAIL_ADMIN }}
          EOF

      - name: Deploy Firebase Functions & Firestore Rules
        run: firebase deploy --only functions,firestore:rules --token "${{ secrets.FIREBASE_TOKEN }}" --project wibest-449fe --non-interactive
