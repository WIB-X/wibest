name: Deploy Firebase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'firebase.json'
      - 'firestore.rules'

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@^13

      - name: Install function dependencies
        run: npm install
        working-directory: functions

      - name: Write functions .env
        run: |
          cat > functions/.env << EOF
          EMAIL_USER=${{ secrets.EMAIL_USER }}
          EMAIL_PASS=${{ secrets.EMAIL_PASS }}
          EMAIL_ADMIN=${{ secrets.EMAIL_ADMIN }}
          EOF

      - name: Write service account credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then
            printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
            # Sanity-check that it's valid JSON before continuing
            node -e "JSON.parse(require('fs').readFileSync('$RUNNER_TEMP/sa.json','utf8'))" || { echo '::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON. Re-paste it without surrounding quotes.'; exit 1; }
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
            echo "USE_SA=1" >> "$GITHUB_ENV"
            echo "Auth: service account ✓"
          else
            echo "Auth: legacy CI token (FIREBASE_TOKEN)"
          fi

      - name: Deploy Firebase Functions & Firestore Rules
        env:
          # When SA is set, do NOT pass FIREBASE_TOKEN (they conflict).
          FIREBASE_TOKEN: ${{ env.USE_SA == '1' && '' || secrets.FIREBASE_TOKEN }}
        run: |
          echo "Using GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-(unset)}"
          firebase deploy --only functions,firestore:rules --project wibest-449fe --non-interactive --force --debug 2>&1 | tail -120
