name: IndexNow ping on push
# Submits changed HTML URLs to IndexNow (Bing, Yandex, Naver) for faster indexing.
# Free, no auth required beyond a key file hosted on the site.

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # need previous commit to diff

      - name: Find changed HTML files and submit to IndexNow
        # Combined into one step + use `set +e` to allow grep/empty results without failing the workflow
        run: |
          set +e
          KEY="d8fc4e9b3a2b4e8a9f1c6d3e7f5a2b9c"

          # Compare HEAD vs HEAD~1 for changed/added .html files
          CHANGED=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- '*.html' 2>/dev/null | head -100)
          if [ -z "$CHANGED" ]; then
            echo "No HTML changes; nothing to submit."
            exit 0
          fi

          # Build URL list, skipping admin/dev/detail pages
          : > /tmp/urls.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              admin*|seed-*|migrate-*|update-*|verify-*|*-detail.html|*detail.html) continue;;
            esac
            # Strip /index.html and prefix with https://wibest.in/
            url=$(echo "$f" | sed 's|/index\.html$|/|; s|^|https://wibest.in/|')
            echo "$url" >> /tmp/urls.txt
          done <<< "$CHANGED"

          if [ ! -s /tmp/urls.txt ]; then
            echo "All changed HTMLs were filtered (admin/dev pages); nothing to submit."
            exit 0
          fi

          echo "Submitting these URLs to IndexNow:"
          cat /tmp/urls.txt
          echo ""

          # Build JSON payload
          URLS_JSON=$(jq -R . /tmp/urls.txt | jq -s .)
          BODY=$(jq -n --arg host "wibest.in" --arg key "$KEY" --arg loc "https://wibest.in/$KEY.txt" --argjson urls "$URLS_JSON" \
            '{host: $host, key: $key, keyLocation: $loc, urlList: $urls}')

          echo "Payload:"
          echo "$BODY"
          echo ""

          # Submit to IndexNow (Bing/Yandex aggregator — propagates to all engines)
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$BODY")
          echo "Response code: $HTTP_CODE"
          cat /tmp/response.txt 2>/dev/null || true
          echo ""

          # 200 = success, 202 = accepted. Anything else: warn but DO NOT fail build.
          # IndexNow may reject if key file isn't yet served by Pages — that's OK, next push retries.
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "::warning::IndexNow returned HTTP $HTTP_CODE (non-fatal — key file may not be live yet, will retry on next push)"
          else
            echo "::notice::IndexNow ping successful ($HTTP_CODE)"
          fi
          # Always exit 0 — workflow failures here block deploys for no good reason
          exit 0
