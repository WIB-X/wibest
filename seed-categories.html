<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seed Categories — WIB Admin</title>
<meta name="robots" content="noindex,nofollow">
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;background:#0b0f17;color:#e5e7eb}
h1{color:#60a5fa}
button{background:#2563eb;color:#fff;border:0;padding:12px 24px;font-size:16px;border-radius:8px;cursor:pointer;margin:6px 4px}
button:hover{background:#1d4ed8}
button:disabled{background:#374151;cursor:not-allowed}
#log{background:#111827;border:1px solid #1f2937;border-radius:8px;padding:16px;margin-top:20px;max-height:600px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap}
.ok{color:#10b981}.err{color:#ef4444}.skip{color:#94a3b8}.info{color:#60a5fa}
.warn{background:#7c2d12;color:#fed7aa;padding:12px;border-radius:8px;margin:16px 0}
.stat{display:inline-block;background:#1f2937;padding:8px 14px;border-radius:8px;margin:4px;font-family:ui-monospace,monospace}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="/config.js"></script>
<script src="/admin-auth-gate.js"></script>
</head>
<body>
<h1>WIB Categories Seeder</h1>
<p>Pushes 200 restaurants + 100 real-estate + 103 jobs + 83 vehicles to their respective Firestore collections.</p>
<div class="warn">Set <code>allow write: if true;</code> on /restaurants, /real_estate, /jobs, /vehicles temporarily, then revert to <code>isAdmin()</code>.</div>
<div id="counts"></div>
<button id="b1" onclick="seed('restaurants','restaurants',RESTAURANTS_DATA)">Seed Restaurants</button>
<button id="b2" onclick="seed('real_estate','real_estate',REALESTATE_DATA)">Seed Real Estate</button>
<button id="b3" onclick="seed('jobs','jobs',JOBS_DATA)">Seed Jobs</button>
<button id="b4" onclick="seed('vehicles','vehicles',VEHICLES_DATA)">Seed Vehicles</button>
<button onclick="seedAll()">Seed Everything</button>
<div id="log"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>var RESTAURANTS_DATA=[],REALESTATE_DATA=[],JOBS_DATA=[],VEHICLES_DATA=[];</script>
<script src="/seed-data-categories.js"></script>
<script>
const db = initFirebase();
const log = document.getElementById('log');
function l(m,c){var d=document.createElement('div');d.textContent=m;if(c)d.className=c;log.appendChild(d);log.scrollTop=log.scrollHeight;}

document.getElementById('counts').innerHTML =
  '<span class="stat">Restaurants: '+RESTAURANTS_DATA.length+'</span>'+
  '<span class="stat">Real Estate: '+REALESTATE_DATA.length+'</span>'+
  '<span class="stat">Jobs: '+JOBS_DATA.length+'</span>'+
  '<span class="stat">Vehicles: '+VEHICLES_DATA.length+'</span>';

async function seed(label, collection, records){
  l('--- Seeding '+records.length+' '+label+' ---', 'info');
  let ok=0, err=0;
  for(let i=0; i<records.length; i+=400){
    const slice = records.slice(i, i+400);
    const batch = db.batch();
    slice.forEach(r => {
      const docRef = db.collection(collection).doc();
      batch.set(docRef, Object.assign({}, r, {
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        seeded: true
      }));
    });
    try{
      await batch.commit();
      ok += slice.length;
      l('OK batch '+(i/400+1)+': '+slice.length+' '+label, 'ok');
    }catch(e){
      err += slice.length;
      l('FAIL batch '+(i/400+1)+': '+e.message, 'err');
    }
  }
  l('=== '+label+' done: '+ok+' ok, '+err+' failed ===', err? 'err':'ok');
  return {ok, err};
}

async function seedAll(){
  await seed('restaurants','restaurants',RESTAURANTS_DATA);
  await seed('real_estate','real_estate',REALESTATE_DATA);
  await seed('jobs','jobs',JOBS_DATA);
  await seed('vehicles','vehicles',VEHICLES_DATA);
  l('\nALL DONE', 'ok');
}
</script>
</body>
</html>
