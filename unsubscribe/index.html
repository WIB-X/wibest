<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsubscribe — WIB</title>
<meta name="description" content="Unsubscribe from the WIB weekly newsletter. Enter your email to stop receiving emails.">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://wibest.in/unsubscribe/">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/polish.css">
<style>
.unsub-wrap{max-width:460px;margin:120px auto 80px;padding:0 20px}
.unsub-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:36px 32px;box-shadow:var(--shadow-md);text-align:center}
.unsub-card h1{font-family:'Outfit',sans-serif;font-size:26px;font-weight:700;margin:0 0 10px;color:var(--text-primary)}
.unsub-card p{color:var(--text-secondary);font-size:15px;line-height:1.6;margin:0 0 24px}
.unsub-form{display:flex;flex-direction:column;gap:12px}
.unsub-form input{padding:14px 18px;border:2px solid var(--border);border-radius:10px;background:var(--bg-secondary);color:var(--text-primary);font:inherit;font-size:15px;text-align:center}
.unsub-form input:focus{outline:none;border-color:var(--accent)}
.unsub-form button{padding:14px 20px;background:var(--accent);color:#fff;border:0;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;font-size:15px}
.unsub-form button:disabled{background:#94a3b8;cursor:not-allowed}
.unsub-msg{margin-top:16px;padding:14px;border-radius:8px;font-size:14px;line-height:1.5}
.unsub-msg.ok{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}
.unsub-msg.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
[data-theme="dark"] .unsub-msg.ok{background:#064e3b;color:#d1fae5}
[data-theme="dark"] .unsub-msg.err{background:#7f1d1d;color:#fecaca}
.unsub-back{display:block;margin-top:20px;font-size:14px;color:var(--text-muted)}
.unsub-back a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<div id="wib-nav-placeholder"></div>

<main class="unsub-wrap">
  <div class="unsub-card">
    <h1>Unsubscribe from newsletter</h1>
    <p>Enter your email below. You'll stop receiving WIB Weekly emails within 24 hours.</p>

    <form class="unsub-form" id="unsubForm">
      <input type="email" id="unsubEmail" placeholder="your@email.com" required autocomplete="email">
      <button type="submit" id="unsubBtn">Unsubscribe</button>
    </form>

    <div class="unsub-msg" id="unsubMsg" style="display:none"></div>

    <div class="unsub-back">
      Changed your mind? <a href="/">Return to WIB</a>
    </div>
  </div>
</main>

<div id="wib-footer-placeholder"></div>

<script src="/config.js"></script>
<script src="/components.js"></script>
<script>
const ENDPOINT = 'https://us-central1-wibest-449fe.cloudfunctions.net/unsubscribe';

// Pre-fill from ?email= query param (if the user arrived via email link)
(function(){
  var p = new URLSearchParams(location.search);
  var e = p.get('email');
  if (e) document.getElementById('unsubEmail').value = e;
})();

document.getElementById('unsubForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('unsubEmail').value.trim();
  const btn = document.getElementById('unsubBtn');
  const msg = document.getElementById('unsubMsg');
  msg.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Processing…';

  try {
    const r = await fetch(ENDPOINT, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email })
    });
    const d = await r.json();
    if (d.ok) {
      msg.className = 'unsub-msg ok';
      msg.textContent = '✓ You have been unsubscribed. You will stop receiving WIB Weekly emails within 24 hours. Sorry to see you go!';
      msg.style.display = 'block';
      document.getElementById('unsubForm').style.display = 'none';
    } else {
      msg.className = 'unsub-msg err';
      msg.textContent = d.error || 'Something went wrong. Please try again or email hello@wibest.in.';
      msg.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Unsubscribe';
    }
  } catch (err) {
    msg.className = 'unsub-msg err';
    msg.textContent = 'Network error. Please try again or email hello@wibest.in to unsubscribe manually.';
    msg.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Unsubscribe';
  }
});
</script>
</body>
</html>
