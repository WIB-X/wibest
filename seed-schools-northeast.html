<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Add Northeast Schools — WIB Admin</title><meta name="robots" content="noindex,nofollow">
<style>body{font-family:system-ui,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;background:#0b0f17;color:#e5e7eb}h1{color:#60a5fa}button{background:#2563eb;color:#fff;border:0;padding:12px 24px;font-size:16px;border-radius:8px;cursor:pointer;margin:6px 4px}button:hover{background:#1d4ed8}button:disabled{background:#374151}#log{background:#111827;border:1px solid #1f2937;border-radius:8px;padding:16px;margin-top:20px;max-height:500px;overflow:auto;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap}.ok{color:#10b981}.err{color:#ef4444}.info{color:#60a5fa}.warn{background:#7c2d12;color:#fed7aa;padding:12px;border-radius:8px;margin:16px 0}.stat{display:inline-block;background:#1f2937;padding:8px 14px;border-radius:8px;margin:4px;font-family:ui-monospace,monospace}table{border-collapse:collapse;margin-top:14px;font-size:12px;width:100%}th,td{border:1px solid #1f2937;padding:5px 8px;text-align:left}th{color:#60a5fa}</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js" defer></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js" defer></script><script src="/config.js"></script><script src="/admin-auth-gate.js"></script></head>
<body><h1>Add Northeast Schools — Shillong, Imphal, Agartala</h1><p>Filling India's most underserved region (NE state capitals).</p>
<div class="warn">⚠️ Review first. Names/boards/localities real. Fees APPROXIMATE — edit <code>/seed-data-schools-northeast.js</code>. Ratings blank.</div>
<div class="warn"><strong>ADDITIVE</strong> — run <strong>once</strong>.</div>
<div id="counts"></div><button onclick="preview()">👁 Preview</button><button id="addBtn" onclick="add()">➕ Add to Firestore</button><div id="preview"></div><div id="log"></div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js" defer></script><script src="/seed-data-schools-northeast.js"></script>
<script>
function l(m,c){const d=document.getElementById('log');const s=document.createElement('div');if(c)s.className=c;s.textContent=m;d.appendChild(s);d.scrollTop=d.scrollHeight;}
function normalize(r){return{name:r.name,category:'school',city:r.city,state:r.state||'',board:r.board||'',type:r.type||'Co-ed',stream:'',speciality:'',fees:r.fees||0,rating:r.rating||0,established:r.established||0,student_count:0,results:r.results||0,board_results:r.results||0,student_teacher_ratio:r.studentTeacherRatio||'',contact:'',address:r.address||'',website:'',highlights:r.highlights||'',createdAt:firebase.firestore.FieldValue.serverTimestamp()};}
function byCity(){const c={};NE_SCHOOLS.forEach(s=>c[s.city]=(c[s.city]||0)+1);return c;}
function showCounts(){const c=byCity();document.getElementById('counts').innerHTML='<div class="stat">Total: '+NE_SCHOOLS.length+'</div>'+Object.keys(c).sort().map(k=>'<div class="stat">'+k+': '+c[k]+'</div>').join('');}
function preview(){showCounts();document.getElementById('preview').innerHTML='<table><thead><tr><th>Name</th><th>City</th><th>Board</th><th>Type</th><th>Fees</th><th>Locality</th></tr></thead><tbody>'+NE_SCHOOLS.map(s=>'<tr><td>'+s.name+'</td><td>'+s.city+'</td><td>'+s.board+'</td><td>'+s.type+'</td><td>'+(s.fees?('₹'+s.fees.toLocaleString('en-IN')):'—')+'</td><td>'+(s.address||'')+'</td></tr>').join('')+'</tbody></table>';l('Preview — '+NE_SCHOOLS.length+' schools.','info');}
async function add(){if(typeof firebase==='undefined'||!firebase.firestore){l('Firebase not ready.','err');return;}if(!confirm('Add '+NE_SCHOOLS.length+'? Additive. Once.'))return;document.getElementById('addBtn').disabled=true;const db=firebase.firestore();showCounts();l('Adding '+NE_SCHOOLS.length+'...','info');let ok=0;const b=db.batch();NE_SCHOOLS.forEach(r=>b.set(db.collection('items').doc(),normalize(r)));try{await b.commit();ok=NE_SCHOOLS.length;l('✓ '+ok,'ok');}catch(e){l('✗ '+e.message,'err');}l('Done: '+ok+' added',ok?'ok':'err');if(ok)l('Tell Claude "northeast imported".','info');document.getElementById('addBtn').disabled=false;}
window.addEventListener('load',()=>setTimeout(showCounts,500));
</script></body></html>
