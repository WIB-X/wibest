<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="hl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="2" rx="20"/>

  <text x="80" y="115" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="rgba(255,255,255,0.88)" letter-spacing="4">WIB · OPEN DATA</text>

  <text x="80" y="230" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="92" font-weight="900" fill="#ffffff" letter-spacing="-3">India, in CSV.</text>
  <text x="80" y="290" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="500" fill="rgba(255,255,255,0.92)">Free verified comparison datasets</text>

  <g transform="translate(80, 360)">
    <rect width="320" height="140" fill="rgba(0,0,0,0.25)" rx="14"/>
    <text x="30" y="60" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="url(#hl)">346</text>
    <text x="30" y="95" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Hospitals</text>
    <text x="30" y="120" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.78)">27 cities</text>
  </g>
  <g transform="translate(420, 360)">
    <rect width="320" height="140" fill="rgba(0,0,0,0.25)" rx="14"/>
    <text x="30" y="60" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="url(#hl)">500</text>
    <text x="30" y="95" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Restaurants</text>
    <text x="30" y="120" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.78)">20 cities</text>
  </g>
  <g transform="translate(760, 360)">
    <rect width="360" height="140" fill="rgba(0,0,0,0.25)" rx="14"/>
    <text x="30" y="60" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="url(#hl)">CC-BY</text>
    <text x="30" y="95" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Free to cite</text>
    <text x="30" y="120" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="rgba(255,255,255,0.78)">No signup, no API key</text>
  </g>

  <text x="80" y="568" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="rgba(255,255,255,0.75)" letter-spacing="2">wibest.in/data</text>
