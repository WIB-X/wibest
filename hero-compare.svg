<svg xmlns="http://www.w3.org/2000/svg" width="560" height="320" viewBox="0 0 560 320" fill="none" role="img" aria-label="Two options compared side by side with data bars">
  <defs>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- floating category chips -->
  <g opacity="0.9">
    <rect x="38" y="26" width="92" height="30" rx="15" fill="#eff6ff"/>
    <circle cx="58" cy="41" r="6" fill="#2563eb"/><rect x="72" y="37" width="44" height="8" rx="4" fill="#bfdbfe"/>
    <rect x="430" y="40" width="96" height="30" rx="15" fill="#f0fdf4"/>
    <circle cx="450" cy="55" r="6" fill="#16a34a"/><rect x="464" y="51" width="50" height="8" rx="4" fill="#bbf7d0"/>
  </g>

  <!-- LEFT card (option A) -->
  <g filter="url(#sh)">
    <rect x="60" y="78" width="196" height="208" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <rect x="84" y="104" width="58" height="58" rx="14" fill="#eff6ff"/>
  <circle cx="113" cy="133" r="16" fill="#2563eb" opacity="0.85"/>
  <rect x="84" y="178" width="120" height="11" rx="5.5" fill="#0f172a"/>
  <rect x="84" y="198" width="92" height="9" rx="4.5" fill="#cbd5e1"/>
  <!-- bars -->
  <rect x="84" y="224" width="148" height="9" rx="4.5" fill="#eef2f7"/><rect x="84" y="224" width="96" height="9" rx="4.5" fill="#93c5fd"/>
  <rect x="84" y="244" width="148" height="9" rx="4.5" fill="#eef2f7"/><rect x="84" y="244" width="120" height="9" rx="4.5" fill="#93c5fd"/>
  <rect x="84" y="264" width="148" height="9" rx="4.5" fill="#eef2f7"/><rect x="84" y="264" width="70" height="9" rx="4.5" fill="#93c5fd"/>

  <!-- VS badge -->
  <circle cx="280" cy="196" r="26" fill="#0f172a"/>
  <text x="280" y="202" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="16" font-weight="800" fill="#ffffff">VS</text>

  <!-- RIGHT card (winner) -->
  <g filter="url(#sh)">
    <rect x="304" y="68" width="196" height="218" rx="18" fill="url(#wing)" stroke="#16a34a" stroke-width="2"/>
  </g>
  <!-- winner check ribbon -->
  <circle cx="476" cy="92" r="18" fill="#16a34a"/>
  <path d="M468 92 474 98 485 86" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="328" y="104" width="58" height="58" rx="14" fill="#dcfce7"/>
  <circle cx="357" cy="133" r="16" fill="#16a34a"/>
  <rect x="328" y="178" width="120" height="11" rx="5.5" fill="#0f172a"/>
  <rect x="328" y="198" width="92" height="9" rx="4.5" fill="#86efac"/>
  <rect x="328" y="224" width="148" height="9" rx="4.5" fill="#eef2f7"/><rect x="328" y="224" width="138" height="9" rx="4.5" fill="#16a34a"/>
  <rect x="328" y="244" width="148" height="9" rx="4.5" fill="#eef2f7"/><rect x="328" y="244" width="128" height="9" rx="4.5" fill="#16a34a"/>
  <rect x="328" y="264" width="148" height="9" rx="4.5" fill="#eef2f7"/><rect x="328" y="264" width="146" height="9" rx="4.5" fill="#16a34a"/>
</svg>
