<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verify Vernacular Posts (KN+ML+BN) — WIB Admin</title>
<meta name="robots" content="noindex,nofollow">
<style>
body{font-family:system-ui,sans-serif;max-width:1100px;margin:30px auto;padding:0 20px;background:#0b0f17;color:#e5e7eb}
h1{color:#60a5fa;margin-bottom:6px}
.sub{color:#94a3b8;font-size:14px;margin-bottom:20px}
button{background:#2563eb;color:#fff;border:0;padding:10px 18px;font-size:14px;border-radius:8px;cursor:pointer;margin:6px 4px}
button:hover{background:#1d4ed8}
button:disabled{background:#374151;cursor:not-allowed}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
.stat{background:#1f2937;padding:14px 18px;border-radius:8px;text-align:center}
.stat .n{font-size:28px;font-weight:700;font-family:'Outfit',sans-serif}
.stat .l{font-size:12px;color:#94a3b8;margin-top:4px;text-transform:uppercase;letter-spacing:.05em}
.stat.ok .n{color:#10b981}.stat.err .n{color:#ef4444}
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}
th{background:#1e293b;padding:10px 12px;text-align:left;font-weight:600;border-bottom:2px solid #334155}
td{padding:10px 12px;border-bottom:1px solid #1f2937;vertical-align:top}
.slug{font-family:ui-monospace,monospace;font-size:12px;color:#cbd5e1}
.status{padding:3px 10px;border-radius:4px;font-size:11px;font-weight:700;text-transform:uppercase;display:inline-block}
.status.ok{background:#065f46;color:#a7f3d0}
.status.fail{background:#991b1b;color:#fecaca}
.notes{font-size:12px;color:#94a3b8}
.warn-bar{background:#7c2d12;color:#fed7aa;padding:12px 16px;border-radius:8px;margin:16px 0;font-size:14px}
.cat-tag{display:inline-block;padding:2px 8px;background:#1e293b;border-radius:4px;font-size:11px;color:#94a3b8;margin-right:6px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js" defer></script>
<script src="/config.js"></script>
<script src="/admin-auth-gate.js"></script>
</head>
<body>
<h1>Vernacular Verification (Kannada + Malayalam + Bengali)</h1>
<p class="sub">Checks all 30 vernacular posts for Firestore document, content length, FAQ array, and URL reachability.</p>
<div class="warn-bar">⚠️ Run this AFTER seeding via /seed-blogs-vernacular.html</div>
<button onclick="verifyAll()">▶ Run Full Verification</button>
<button onclick="window.open('/seed-blogs-vernacular.html','_blank')">Open Seeder</button>
<div class="summary" id="summary"></div>
<table id="results"><thead><tr><th>Slug</th><th>Firestore</th><th>URL</th><th>Notes</th></tr></thead><tbody></tbody></table>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js" defer></script>
<script>
const TOPICS = ['best-phone-under-15000-india','best-phone-under-30000-india','best-laptop-under-50000-india','best-earbuds-under-2000-india','iphone-16-vs-samsung-s25','best-car-under-10-lakh-india','best-electric-scooter-india','goa-travel-guide','best-places-visit-india-april','best-hospitals-bangalore'];
const LANGS = {'kn':'Kannada','ml':'Malayalam','bn':'Bengali'};
const db = initFirebase();

function el(t,a,x){const e=document.createElement(t);if(a)Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));if(x!=null)e.textContent=x;return e;}

async function checkFirestore(slug){
  try{
    const doc = await db.collection('blog_posts').doc(slug).get();
    if(!doc.exists) return {ok:false, reason:'doc not found'};
    const d = doc.data();
    const issues = [];
    if(!d.title || d.title.length < 10) issues.push('title missing');
    if(!d.content || d.content.length < 300) issues.push(`content too short (${(d.content||'').length}b)`);
    if(!Array.isArray(d.faq) || d.faq.length < 2) issues.push('FAQ missing');
    return {ok: issues.length===0, reason: issues.join(', ')||'all fields present', meta:{contentLen:(d.content||'').length, faqCount:(d.faq||[]).length, lang:d.lang}};
  }catch(e){return {ok:false, reason:'fetch error: '+e.message};}
}

async function checkUrl(slug, lang){
  const url = `/${lang}/blog/${slug}/`;
  try{
    const r = await fetch(url, {cache:'no-store'});
    return r.ok ? {reachable:true, reason:'OK'} : {reachable:false, reason:`HTTP ${r.status}`};
  }catch(e){return {reachable:false, reason:'fetch error: '+e.message};}
}

async function verifyAll(){
  const tbody = document.querySelector('#results tbody');
  tbody.innerHTML = '';
  let total=0, fsOk=0, urlOk=0;
  for(const lang of Object.keys(LANGS)){
    for(const topic of TOPICS){
      total++;
      const slug = `${topic}-${lang}`;
      const fs = await checkFirestore(slug);
      const url = await checkUrl(slug, lang);
      const tr = el('tr');
      tr.appendChild(el('td')).innerHTML = `<span class="cat-tag">${LANGS[lang]}</span><span class="slug">${slug}</span>`;
      const fsCell = el('td');
      fsCell.appendChild(el('span',{class:'status '+(fs.ok?'ok':'fail')}, fs.ok?'✓ OK':'✗ FAIL'));
      if(fs.meta) fsCell.appendChild(el('div',{class:'notes'}, `${fs.meta.contentLen}b · ${fs.meta.faqCount} FAQs · lang=${fs.meta.lang}`));
      tr.appendChild(fsCell);
      tr.appendChild(el('td')).innerHTML = `<span class="status ${url.reachable?'ok':'fail'}">${url.reachable?'✓':'✗'} ${url.reason}</span>`;
      tr.appendChild(el('td',{class:'notes'}, fs.reason));
      tbody.appendChild(tr);
      if(fs.ok) fsOk++;
      if(url.reachable) urlOk++;
      renderSummary(total, fsOk, urlOk);
    }
  }
}

function renderSummary(total, fsOk, urlOk){
  document.getElementById('summary').innerHTML = `
    <div class="stat ${fsOk===total?'ok':'err'}"><div class="n">${fsOk}/${total}</div><div class="l">Firestore</div></div>
    <div class="stat ${urlOk===total?'ok':'err'}"><div class="n">${urlOk}/${total}</div><div class="l">URL Reachable</div></div>
    <div class="stat"><div class="n">${total}</div><div class="l">Total Checked</div></div>
    <div class="stat ${fsOk===total&&urlOk===total?'ok':'err'}"><div class="n">${fsOk+urlOk}/${total*2}</div><div class="l">All Checks</div></div>
  `;
}
</script>
</body>
</html>
