<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — WIB</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
.page{max-width:600px;margin:calc(var(--nav-height)+var(--cat-height)+48px) auto 60px;padding:0 24px}
.page h1{font-family:'Outfit',sans-serif;font-size:36px;font-weight:700;margin-bottom:8px}
.page p{color:var(--text-secondary);font-size:15px;line-height:1.7;margin-bottom:24px}
.contact-form{display:flex;flex-direction:column;gap:16px}
.contact-form input,.contact-form textarea,.contact-form select{padding:12px 16px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text-primary);font-family:inherit;font-size:14px;transition:border .2s}
.contact-form input:focus,.contact-form textarea:focus,.contact-form select:focus{outline:none;border-color:var(--accent)}
.contact-form textarea{resize:vertical;min-height:120px}
.form-msg{font-size:13px;text-align:center;padding:10px;border-radius:6px;margin-top:8px}
.form-msg.success{background:var(--green-bg);color:var(--green)}
.form-msg.error{background:#fef2f2;color:var(--red)}
.contact-info{margin-top:40px;padding:24px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);transition:background .3s}
.contact-info h3{font-family:'Outfit',sans-serif;font-size:16px;font-weight:600;margin-bottom:12px}
.contact-info p{font-size:14px;margin-bottom:8px}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JBXR43H9PE"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-JBXR43H9PE");</script>
<link rel="canonical" href="https://wibest.in/contact/">
<meta name="description" content="Have a question or suggestion? Contact the WIB team. We read every message.">
<meta property="og:title" content="Contact WIB">
<meta property="og:description" content="Get in touch with WIB for questions, feedback, or partnership opportunities.">
<meta property="og:url" content="https://wibest.in/contact/">
<meta property="og:image" content="https://wibest.in/og-default.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@wibest_in">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://wibest.in"},{"@type":"ListItem","position":2,"name":"Contact","item":"https://wibest.in/contact/"}]}</script>
<script src="/affiliate-config.js" async></script>
<script src="/ads.js" async></script>
</head>
<body>
<div id="wib-nav-placeholder"></div>

<div class="page">
  <h1>Contact Us</h1>
  <p>Have feedback, found an error, or want to partner with us? Send us a message.</p>
  <form class="contact-form" onsubmit="submitContact(event)" id="contactForm">
    <!-- Honeypot: hidden from real users, bots fill it in -->
    <input type="text" name="website" tabindex="-1" autocomplete="off" style="display:none;position:absolute;left:-9999px">
    <input type="text" name="name" placeholder="Your name" required>
    <input type="email" name="email" placeholder="Your email" required>
    <select name="subject" required><option value="">Select a topic</option><option>Data correction</option><option>New listing request</option><option>Partnership inquiry</option><option>Feedback</option><option>Bug report</option><option>Other</option></select>
    <textarea name="message" placeholder="Your message" required></textarea>
    <button type="submit" class="btn-primary" id="contactBtn">Send Message</button>
  </form>
  <div id="contactMsg" style="display:none"></div>
  <div class="contact-info">
    <h3>Other ways to reach us</h3>
    <p>Email: <a href="mailto:hello@wibest.in" style="color:var(--accent)">hello@wibest.in</a></p>
  </div>
</div>
<div id="wib-footer-placeholder"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="/config.js"></script>
<script src="/components.js"></script>
<script src="/sanitize.js"></script>
<script>
const db=initFirebase();
const _contactLoadTime=Date.now();
async function submitContact(e){
  e.preventDefault();
  const btn=document.getElementById('contactBtn');
  const msg=document.getElementById('contactMsg');
  const f=e.target;
  // Honeypot check
  if(!checkHoneypot(f.website.value)){return;}
  // Timing check (must take at least 2.5s to fill out)
  if(!checkTiming(_contactLoadTime)){msg.className='form-msg error';msg.textContent='Please fill in the form carefully.';msg.style.display='block';return;}
  // Rate limiting (1 submission per 30s)
  if(!checkRateLimit('contact',30000)){msg.className='form-msg error';msg.textContent='Please wait before submitting again.';msg.style.display='block';return;}
  // Sanitize inputs
  const name=sanitizeText(f.name.value,100);
  const email=sanitizeText(f.email.value,200).toLowerCase();
  const subject=sanitizeText(f.subject.value,100);
  const message=sanitizeText(f.message.value,2000);
  if(!name||!isValidEmail(email)||!subject||!message){msg.className='form-msg error';msg.textContent='Please fill in all fields correctly.';msg.style.display='block';return;}
  btn.disabled=true;btn.textContent='Sending...';
  try{
    await db.collection('contact_messages').add({name,email,subject,message,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    msg.className='form-msg success';msg.textContent='Message sent. We will get back to you soon.';msg.style.display='block';f.reset();
  }catch(err){msg.className='form-msg error';msg.textContent='Failed to send. Please try again.';msg.style.display='block'}
  btn.disabled=false;btn.textContent='Send Message';
}
</script>
<script src="/chat-widget.js"></script>
</body>
</html>
