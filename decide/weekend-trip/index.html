<main class="de-wrap">
  <div class="de-hero">
    <h1>Plan my <span>weekend trip</span></h1>
    <p>5 questions. Destination + stay + how to get there. Within driving distance from your city.</p>
  </div>

<div id="wib-footer-placeholder"></div>

<script src="/cookie-consent.js" defer></script>
<script src="/decide-engine.js?v=20260420"></script>
<script>
WIBDecide.run({
  slug: 'weekend-trip',
  accent: '#ea580c',
  aiContext: 'You are WIB AI helping an Indian traveler pick a weekend destination (2-3 days) within driving distance from their home city. Stick to destinations 100-400 km away (max 6-8 hr drive). For Bangalore: Coorg, Chikmagalur, Mysore, Wayanad, Pondicherry, Sakleshpur, Yelagiri, Hampi, Mahabalipuram, Mantralayam, Yercaud. For Mumbai: Lonavala, Mahabaleshwar, Matheran, Igatpuri, Kashid, Tarkarli, Nashik wineries, Daman, Diu, Sajjangad. For Delhi: Mussoorie, Nainital, Rishikesh, Lansdowne, Kasauli, Jim Corbett, Agra, Jaipur, Bharatpur. For Chennai: Pondicherry, Yercaud, Tirupati, Mahabalipuram, Kanchipuram, Vellore, Tranquebar. For Hyderabad: Nagarjuna Sagar, Ananthagiri, Horsley Hills, Belum Caves, Warangal, Bidar. Recommend ONE destination with: drive time, road quality, recommended stay (real hotel/homestay name + price ₹), top 2 things to do, fuel cost estimate, peak vs off-peak weekend distinction. Honestly call out if monsoon makes it bad.',
  category: 'Travel',
  affiliates: [
    { label: 'Book on MakeMyTrip', url: 'https://www.makemytrip.com/hotels/hotels-in-{{name}}.html', style: 'background:#eb2026;color:#fff' },
    { label: 'Goibibo', url: 'https://www.goibibo.com/hotels/hotels-in-{{name}}/', style: 'background:#0080ff;color:#fff' },
    { label: 'See on WIB Travel', url: 'https://wibest.in/travel/?q={{name}}', style: 'background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border)' }
  ],
  questions: [
    { key:'city', q:"Where do you live?", opts: [
      { emoji:'🏙️', label:'Bangalore', val:'Bangalore' },
      { emoji:'🌊', label:'Mumbai', val:'Mumbai' },
      { emoji:'🏛️', label:'Delhi / NCR', val:'Delhi' },
      { emoji:'🏖️', label:'Chennai', val:'Chennai' },
      { emoji:'🌇', label:'Hyderabad', val:'Hyderabad' },
      { emoji:'🎭', label:'Kolkata', val:'Kolkata' },
      { emoji:'🏞️', label:'Pune', val:'Pune' },
      { emoji:'📍', label:'Other (mention in next question)', val:'other' }
    ]},
    { key:'when', q:"When are you going?", opts: [
      { emoji:'⚡', label:'This weekend', val:'this-weekend' },
      { emoji:'📅', label:'Next 2 weeks', val:'2-weeks' },
      { emoji:'🗓️', label:'Next month', val:'next-month' },
      { emoji:'🎯', label:'Long weekend (specific holiday)', val:'long-weekend' }
    ]},
    { key:'vibe', q:"What kind of weekend?", opts: [
      { emoji:'🏔️', label:'Hill station / cool weather', val:'hills' },
      { emoji:'🏖️', label:'Beach / waterfront', val:'beach' },
      { emoji:'🛕', label:'Heritage / culture', val:'heritage' },
      { emoji:'🌿', label:'Nature / wildlife', val:'wildlife' },
      { emoji:'🍷', label:'Food + drinks scene', val:'food' },
      { emoji:'🧘', label:'Quiet / wellness', val:'wellness' },
      { emoji:'🏃', label:'Adventure / trekking', val:'adventure' }
    ]},
    { key:'budget', q:"Budget per person (total)?", opts: [
      { emoji:'💵', label:'Under ₹3,000', val:'under-3k' },
      { emoji:'💰', label:'₹3,000 – 8,000', val:'3-8k' },
      { emoji:'💎', label:'₹8,000 – 20,000', val:'8-20k' },
      { emoji:'👑', label:'No budget limit', val:'no-limit' }
    ]},
    { key:'group', q:"Who's coming?", opts: [
      { emoji:'🧍', label:'Solo', val:'solo' },
      { emoji:'💑', label:'Couple', val:'couple' },
      { emoji:'👨‍👩‍👧', label:'Family with kids', val:'family-kids' },
      { emoji:'👵👴', label:'Family with senior parents', val:'family-seniors' },
      { emoji:'👯', label:'Friends', val:'friends' }
    ]}
  ]
});
</script>
