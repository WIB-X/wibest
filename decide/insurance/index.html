<body>
<div id="wib-nav-placeholder"></div>

<main class="de-wrap">
  <div class="de-hero">
    <h1>Right insurance for <span>your family</span></h1>
    <p>6 quick questions. We'll recommend the exact plan + insurer — accounting for premium, tax savings, and claim ratio.</p>
  </div>

  <div id="decide-root"></div>
</main>

<div id="wib-footer-placeholder"></div>

<script src="/config.js"></script>
<script src="/components.js?v=20260505a"></script>
<script src="/polish.js?v=20260419" defer></script>
<script src="/cookie-consent.js" defer></script>
<script src="/decide-engine.js?v=20260420"></script>
<script>
WIBDecide.run({
  slug: 'insurance',
  accent: '#0891b2',
  aiContext: 'You are WIB AI helping an Indian shopper choose insurance. Recommend ONE specific plan from real Indian insurers (HDFC Life, LIC, Max Life, ICICI Pru, Tata AIA for term; HDFC ERGO, Niva Bupa, Star Health, Care for health; Acko, Digit, Bajaj Allianz for car). Use real 2025-26 premium amounts in ₹. Always consider Claim Settlement Ratio (CSR), tax benefits under 80C/80D, network hospitals/garages. Mention if buying directly online is cheaper than via agent. End with a clear primary recommendation + 2 alternatives.',
  category: 'Insurance',
  affiliates: [
    { label: 'View on WIB Insurance', url: 'https://wibest.in/insurance/?q={{name}}', style: 'background:#0891b2;color:#fff' },
    { label: 'Get expert help', url: 'https://wibest.in/contact/?subject=Insurance enquiry: {{name}}', style: 'background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border)' }
  ],
  questions: [
    { key:'type', q:"What kind of insurance do you need?", opts: [
      { emoji:'🛡️', label:'Term life — protect family income', val:'term-life' },
      { emoji:'🏥', label:'Health insurance — for self/family', val:'health' },
      { emoji:'👵', label:'Health insurance — for senior parents', val:'health-senior' },
      { emoji:'🚗', label:'Car insurance', val:'car' },
      { emoji:'🛵', label:'Two-wheeler insurance', val:'bike' },
      { emoji:'✈️', label:'Travel insurance', val:'travel' }
    ]},
    { key:'age', q:"What's your age?", sub:"Used to estimate premium accurately", opts: [
      { emoji:'🎓', label:'Under 30', val:'under-30' },
      { emoji:'💼', label:'30 – 45', val:'30-45' },
      { emoji:'🧑‍🦳', label:'45 – 60', val:'45-60' },
      { emoji:'👴', label:'60+', val:'60-plus' }
    ]},
    { key:'family', q:"How many people to cover?", opts: [
      { emoji:'🧍', label:'Just me', val:'1' },
      { emoji:'👫', label:'Me + spouse (2)', val:'2' },
      { emoji:'👨‍👩‍👧', label:'Me + spouse + 1 child (3)', val:'3' },
      { emoji:'👨‍👩‍👧‍👦', label:'Family of 4', val:'4' },
      { emoji:'👨‍👩‍👧‍👦', label:'Family of 5+', val:'5-plus' }
    ]},
    { key:'budget', q:"What annual premium are you comfortable with?", opts: [
      { emoji:'💵', label:'Under ₹10,000', val:'under-10k' },
      { emoji:'💰', label:'₹10,000 – ₹25,000', val:'10-25k' },
      { emoji:'💎', label:'₹25,000 – ₹50,000', val:'25-50k' },
      { emoji:'👑', label:'₹50,000+', val:'above-50k' },
      { emoji:'🤷', label:'Tell me what I need first', val:'unknown' }
    ]},
    { key:'tax', q:"Is tax-saving a priority?", sub:"80C / 80D deductions", opts: [
      { emoji:'✅', label:'Yes — maximise tax benefit', val:'maximise-tax' },
      { emoji:'➡️', label:'Nice to have', val:'nice' },
      { emoji:'❌', label:'Doesn\'t matter — pure protection', val:'no' }
    ]},
    { key:'medical', q:"Any pre-existing conditions to declare?", sub:"Affects which plans accept you", opts: [
      { emoji:'✅', label:'None — fully healthy', val:'none' },
      { emoji:'⚠️', label:'Diabetes / BP / cholesterol', val:'lifestyle' },
      { emoji:'🩺', label:'Heart / kidney / cancer history', val:'major' },
      { emoji:'🤷', label:'Not sure', val:'unsure' }
    ]}
  ]
});
</script>
