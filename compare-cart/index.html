<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Compare List — WIB</title>
<meta name="description" content="Side-by-side comparison of items you've added from across wibest.in — restaurants, hospitals, schools, and more.">
<link rel="canonical" href="https://wibest.in/compare-cart/">
<meta name="robots" content="noindex,follow">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=20260421b">
<link rel="stylesheet" href="/polish.css?v=20260421">
<style>
.wrap{max-width:1100px;margin:calc(var(--nav-height)+var(--cat-height)+32px) auto 80px;padding:0 24px}
.wrap h1{font-family:Outfit,sans-serif;font-size:32px;font-weight:800;margin-bottom:6px}
.wrap .lede{color:var(--text-secondary);font-size:15px;margin-bottom:24px}
.bc{font-size:12px;color:var(--text-muted);margin-bottom:18px}.bc a{color:var(--accent);text-decoration:none}
.empty{text-align:center;padding:60px 24px;color:var(--text-muted);background:var(--bg-card);border:1px solid var(--border);border-radius:12px}
.empty h2{font-family:Outfit,sans-serif;font-size:20px;color:var(--text-primary);margin-bottom:8px}
.empty p{margin-bottom:18px;font-size:14px}
.empty a{display:inline-block;padding:10px 22px;background:var(--accent);color:#fff;border-radius:10px;font-weight:600;text-decoration:none}
.cart-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.btn-clear{padding:8px 16px;background:transparent;color:var(--text-muted);border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.btn-clear:hover{border-color:#dc2626;color:#dc2626}
.cmp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:32px}
.cmp-cell{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:18px 20px;position:relative}
.cmp-cell-cat{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;font-weight:700;margin-bottom:6px}
.cmp-cell-name{font-family:Outfit,sans-serif;font-size:16px;font-weight:700;line-height:1.3;margin-bottom:8px;color:var(--text-primary)}
.cmp-cell-meta{font-size:13px;color:var(--text-secondary);margin-bottom:12px;line-height:1.5}
.cmp-cell-actions{display:flex;gap:6px}
.cmp-cell-actions a{flex:1;padding:6px 10px;background:var(--accent);color:#fff;border-radius:6px;font-size:12px;font-weight:600;text-decoration:none;text-align:center}
.cmp-cell-remove{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:var(--bg-secondary);border:1px solid var(--border);color:var(--text-muted);cursor:pointer;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
.cmp-cell-remove:hover{background:#fee2e2;color:#dc2626;border-color:#dc2626}
.note{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 18px;font-size:13px;color:var(--text-secondary);line-height:1.6}
.note strong{color:var(--text-primary)}
</style>
</head>
<body>
<div id="wib-nav-placeholder"></div>

<main class="wrap">
  <div class="bc"><a href="/">Home</a> &rsaquo; Compare List</div>
  <h1>Your Compare List</h1>
  <p class="lede">Items you have added from across wibest.in. Compare side-by-side, then click through to view each.</p>

  <div id="cmp-content"></div>
</main>

<div id="wib-footer-placeholder"></div>
<script src="/config.js"></script>
<script src="/components.js?v=20260427"></script>
<script src="/polish.js?v=20260419" defer></script>
<script src="/cookie-consent.js" defer></script>
<script src="/compare-cart.js?v=20260504"></script>
<script>
(function(){
  function esc(s){return String(s||'').replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function render(){
    var content = document.getElementById('cmp-content');
    var items = WIBCompare.load();
    if (!items.length){
      content.innerHTML =
        '<div class="empty">' +
          '<h2>Your compare list is empty</h2>' +
          '<p>Add items from any of our category pages — restaurants, hospitals, schools, more — by clicking the "Add to compare" button on cards.</p>' +
          '<a href="/restaurants/">Browse restaurants</a>' +
        '</div>';
      return;
    }
    var actions =
      '<div class="cart-actions">' +
        '<div style="font-size:14px;color:var(--text-secondary)">' + items.length + ' item' + (items.length > 1 ? 's' : '') + ' in your compare list</div>' +
        '<button class="btn-clear" onclick="if(confirm(\'Clear all items?\')){WIBCompare.clear();location.reload()}">Clear all</button>' +
      '</div>';
    var grid = '<div class="cmp-grid">' + items.map(function(item, i){
      var meta = '';
      if (item.r) meta += '★ ' + item.r + ' &nbsp;';
      if (item.city) meta += '📍 ' + esc(item.city) + ' &nbsp;';
      if (item.tags) meta += esc(item.tags);
      var actionLink = item.u ? '<a href="' + esc(item.u) + '">View page</a>' : '';
      return '<div class="cmp-cell">' +
        '<button class="cmp-cell-remove" title="Remove" onclick="WIBCompare.remove(' + i + ');location.reload()">&times;</button>' +
        '<div class="cmp-cell-cat">' + esc(item.c || 'Item') + '</div>' +
        '<div class="cmp-cell-name">' + esc(item.n) + '</div>' +
        '<div class="cmp-cell-meta">' + meta + '</div>' +
        '<div class="cmp-cell-actions">' + actionLink + '</div>' +
      '</div>';
    }).join('') + '</div>';
    var note =
      '<div class="note">' +
        '<strong>Tip:</strong> Compare list is stored in your browser only — clearing browser data will reset it. We do not store your selections on a server.' +
      '</div>';
    content.innerHTML = actions + grid + note;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render);
  else render();
})();
</script>
</body>
</html>
