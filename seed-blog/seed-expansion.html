<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIB — Seed Expansion Blog Articles</title>
<meta name="robots" content="noindex,nofollow">
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;padding:40px}h1{font-size:28px;margin-bottom:8px}.sub{color:#94a3b8;margin-bottom:24px}.warn{background:#422006;border:1px solid #f59e0b;padding:12px 16px;border-radius:8px;margin-bottom:24px;color:#fbbf24;font-size:14px}button{padding:14px 28px;font-size:16px;font-weight:700;border:none;border-radius:8px;cursor:pointer;background:#2563eb;color:white}button:disabled{background:#475569;cursor:not-allowed}input{padding:10px 14px;border:1.5px solid #334155;border-radius:8px;background:#1e293b;color:#e2e8f0;font-size:14px;width:280px;margin-right:8px;margin-bottom:12px;font-family:inherit}input:focus{outline:none;border-color:#3b82f6}.login-row{margin-bottom:20px}#log{background:#1e293b;border-radius:8px;padding:20px;margin-top:20px;font-family:monospace;font-size:13px;max-height:500px;overflow-y:auto;white-space:pre-wrap}.s{color:#4ade80}.e{color:#f87171}.i{color:#60a5fa}</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js" defer></script>
<script src="/config.js"></script>
<script src="/admin-auth-gate.js"></script>
</head>
<body>
<h1>Seed Expansion Blog Articles</h1>
<p class="sub">Adds 8 new SEO articles for new cities and categories.</p>
<div class="warn">Run ONCE only. Login with Firebase admin credentials.</div>
<div class="login-row">
  <input type="email" id="email" placeholder="Admin email">
  <input type="password" id="password" placeholder="Password">
  <button id="loginBtn">Login & Seed 8 Articles</button>
</div>
<div id="log"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const fc={apiKey:"AIzaSyA_IcdzywseRgXTY8MqiOY1LLfwnfps3Oo",authDomain:"wibest-449fe.firebaseapp.com",projectId:"wibest-449fe",storageBucket:"wibest-449fe.firebasestorage.app",messagingSenderId:"438027122345",appId:"1:438027122345:web:70b5427de9bf0a74f51bb8"};
const app=initializeApp(fc);const auth=getAuth(app);const db=getFirestore(app);
const logEl=document.getElementById('log');
function log(m,t=''){const s=document.createElement('span');s.className=t;s.textContent=m+'\n';logEl.appendChild(s);logEl.scrollTop=logEl.scrollHeight;}

document.getElementById('loginBtn').addEventListener('click',async function(){
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('password').value;
  if(!email||!pass){log('Please enter email and password.','e');return;}
  this.disabled=true;this.textContent='Logging in...';
  try{
    await signInWithEmailAndPassword(auth,email,pass);
    log('Logged in successfully!','s');

    // Load expansion blog data
    const script=document.createElement('script');
    script.src='/seed-blog/data-blogs-expansion.js';
    script.onload=async function(){
      log('Seeding '+EXPANSION_BLOGS.length+' articles...','i');
      let ok=0;
      for(const a of EXPANSION_BLOGS){
        try{
          const data={...a,created_at:serverTimestamp(),published_at:serverTimestamp(),updated_at:serverTimestamp()};
          const id=data.id;delete data.id;
          await setDoc(doc(db,"blog_posts",id),data);
          ok++;log('['+ok+'/'+EXPANSION_BLOGS.length+'] '+a.title,'s');
        }catch(e){log('FAILED: '+a.title+' — '+e.message,'e');}
      }
      log('\nDone! '+ok+' articles created.','s');
      document.getElementById('loginBtn').textContent='Complete';
    };
    document.head.appendChild(script);
  }catch(e){log('Login failed: '+e.message,'e');this.disabled=false;this.textContent='Login & Seed 8 Articles';}
});
</script>
</body>
</html>
