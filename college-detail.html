<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Details — WIB</title>
<meta name="description" content="Compare fees, courses, placements, and reviews for this college on WIB — India's comparison platform.">
<meta property="og:site_name" content="WIB">
<meta property="og:type" content="website">
<meta property="og:image" content="https://wibest.in/og-default.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@wibest_in">
<link rel="canonical" href="https://wibest.in/college-detail.html">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
.content{max-width:1200px;margin:calc(var(--nav-height)+var(--cat-height)+24px) auto 60px;padding:0 24px}
.breadcrumb{font-size:13px;color:var(--text-muted);margin-bottom:20px}.breadcrumb a{color:var(--accent)}
.detail-grid{display:grid;grid-template-columns:1fr 360px;gap:24px}
.hero-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:32px;transition:background .3s}
.college-name{font-family:'Outfit',sans-serif;font-size:28px;font-weight:700;letter-spacing:-0.02em;margin-bottom:8px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.badge{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;background:var(--tag-bg);color:var(--tag-text)}
.badge.stream{background:var(--accent-light);color:var(--accent)}
.badge.rating{background:var(--green-bg);color:var(--green)}
.desc{color:var(--text-secondary);font-size:14px;line-height:1.7}
.section{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-top:20px;transition:background .3s}
.section-title{font-family:'Outfit',sans-serif;font-size:18px;font-weight:600;margin-bottom:16px}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.info-item{padding:12px 16px;background:var(--bg-secondary);border-radius:8px}
.info-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.info-value{font-size:14px;font-weight:600}
.course-tags{display:flex;flex-wrap:wrap;gap:8px}
.course-tag{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;background:var(--accent-light);color:var(--accent)}
.review-form{background:var(--bg-secondary);border-radius:8px;padding:20px;margin-top:16px}
.review-form h4{font-size:15px;font-weight:600;margin-bottom:12px}
.rf-row{display:flex;gap:12px;margin-bottom:12px}
.rf-row input,.rf-row textarea{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg-card);color:var(--text-primary);font-family:inherit;font-size:14px}
.rf-row input:focus,.rf-row textarea:focus{outline:none;border-color:var(--accent)}
.rf-row textarea{resize:vertical;min-height:70px}
.star-select{display:flex;gap:4px;margin-bottom:12px}
.star-select button{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--bg-card);cursor:pointer;font-size:16px;color:var(--text-muted);transition:all .2s}
.star-select button.active{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.rf-type{display:flex;gap:8px;margin-bottom:12px}
.rf-type button{padding:8px 16px;border-radius:6px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);font-family:inherit;font-size:13px;cursor:pointer;transition:all .2s}
.rf-type button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.form-msg{font-size:13px;text-align:center;padding:8px;border-radius:6px;margin-top:8px}
.form-msg.success{background:var(--green-bg);color:var(--green)}
.form-msg.error{background:#fef2f2;color:var(--red)}
.review-empty{color:var(--text-muted);font-size:14px;padding:16px;text-align:center;background:var(--bg-secondary);border-radius:8px}
.review-item{padding:14px;background:var(--bg-secondary);border-radius:8px;margin-bottom:8px}
.sidebar{display:flex;flex-direction:column;gap:20px}
.sidebar-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;transition:background .3s}
.sidebar-title{font-family:'Outfit',sans-serif;font-size:15px;font-weight:600;margin-bottom:12px}
.enquiry-form{display:flex;flex-direction:column;gap:12px}
.enquiry-form input,.enquiry-form textarea,.enquiry-form select{padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg-secondary);color:var(--text-primary);font-family:inherit;font-size:14px}
.enquiry-form input:focus,.enquiry-form textarea:focus,.enquiry-form select:focus{outline:none;border-color:var(--accent)}
.enquiry-form textarea{resize:vertical;min-height:80px}
.map-frame{width:100%;height:220px;border:none;border-radius:8px;background:var(--bg-secondary)}
.loading{text-align:center;padding:100px 24px;color:var(--text-muted)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.detail-grid{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}.college-name{font-size:22px}.rf-row{flex-direction:column}}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JBXR43H9PE"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-JBXR43H9PE");</script>
</head>
<body>
<div id="wib-nav-placeholder"></div>

<div class="content" id="pageContent"><div class="skeleton" style="height:300px;margin-bottom:16px"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="skeleton" style="height:120px"></div><div class="skeleton" style="height:120px"></div></div></div>
<div id="wib-footer-placeholder"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="/config.js"></script>
<script src="/components.js"></script>
<script src="/sanitize.js"></script>
<script>
const db=initFirebase();
let selectedRating=0,selectedType='student';

async function load(){
  const id=new URLSearchParams(window.location.search).get('id');
  const autoEnquire=new URLSearchParams(window.location.search).get('enquire')==='true';
  if(!id){document.getElementById('pageContent').innerHTML='<div class="loading">College not found. <a href="/colleges" style="color:var(--accent)">Browse all colleges</a></div>';return}
  try{
    let doc=await db.collection('colleges').doc(id).get();
    if(!doc.exists)doc=await db.collection('items').doc(id).get();
    if(!doc.exists){document.getElementById('pageContent').innerHTML='<div class="loading">College not found. <a href="/colleges" style="color:var(--accent)">Browse all colleges</a></div>';return}
    const c=doc.data();
    const name=c.name||'College Details';
    document.title=name+' — WIB';
    document.querySelector('meta[name="description"]').setAttribute('content','Compare fees, courses, placements and reviews for '+name+' on WIB.');
    const canonicalUrl='https://wibest.in/college-detail.html?id='+id;
    document.querySelector('link[rel="canonical"]').setAttribute('href',canonicalUrl);
    // JSON-LD EducationalOrganization schema
    const jsonLd={'@context':'https://schema.org','@type':'CollegeOrUniversity','name':name,'description':c.description||('College in '+(c.city||'India')),'url':canonicalUrl,'address':{'@type':'PostalAddress','addressLocality':c.city||'','addressCountry':'IN'}};
    if(c.google_rating||c.rating) jsonLd['aggregateRating']={'@type':'AggregateRating','ratingValue':c.google_rating||c.rating,'bestRating':5,'ratingCount':c.reviews_count||1};
    const ldScript=document.createElement('script');ldScript.type='application/ld+json';ldScript.text=JSON.stringify(jsonLd);document.head.appendChild(ldScript);
    const bcScript=document.createElement('script');bcScript.type='application/ld+json';bcScript.text=JSON.stringify({'@context':'https://schema.org','@type':'BreadcrumbList','itemListElement':[{'@type':'ListItem','position':1,'name':'Home','item':'https://wibest.in'},{'@type':'ListItem','position':2,'name':'Colleges','item':'https://wibest.in/colleges/'},{'@type':'ListItem','position':3,'name':name,'item':canonicalUrl}]});document.head.appendChild(bcScript);
    render(id,c,autoEnquire);
  }catch(err){console.error(err);document.getElementById('pageContent').innerHTML='<div class="loading">Error loading. Please refresh.</div>'}
}

function render(id,c,autoEnquire){
  const r=c.google_rating||0,lat=c.coordinates?.lat||c.lat||0,lng=c.coordinates?.lng||c.lng||0;
  const courses=c.courses||[];const eName=(c.name||'').replace(/'/g,'');

  document.getElementById('pageContent').innerHTML=`
  <div class="breadcrumb"><a href="/colleges">Colleges</a> / ${c.name}</div>
  <div class="detail-grid"><div class="main-col">
    <div class="hero-card"><h1 class="college-name">${c.name}</h1>
      <div class="badges">${c.stream?`<span class="badge stream">${c.stream}</span>`:''}<span class="badge">${c.city||''}</span><span class="badge">${c.type||''}</span>${c.accreditation?`<span class="badge">${c.accreditation}</span>`:''}${r>0?`<span class="badge rating">&#9733; ${r.toFixed(1)}</span>`:''}</div>
      ${c.description?`<p class="desc">${c.description}</p>`:''}
    </div>
    <div class="section"><div class="section-title">Academic Details</div>
      <div class="info-grid">
        <div class="info-item"><div class="info-label">Stream</div><div class="info-value">${c.stream||'N/A'}</div></div>
        <div class="info-item"><div class="info-label">Type</div><div class="info-value">${c.type||'N/A'}</div></div>
        <div class="info-item"><div class="info-label">City</div><div class="info-value">${c.city||'N/A'}</div></div>
        <div class="info-item"><div class="info-label">Established</div><div class="info-value">${c.established||'N/A'}</div></div>
        <div class="info-item"><div class="info-label">Annual Fees</div><div class="info-value">${c.fees?'₹'+c.fees.toLocaleString('en-IN'):'N/A'}</div></div>
        <div class="info-item"><div class="info-label">Accreditation</div><div class="info-value">${c.accreditation||'N/A'}</div></div>
        <div class="info-item"><div class="info-label">Placement %</div><div class="info-value">${c.placement_percent?c.placement_percent+'%':'N/A'}</div></div>
        <div class="info-item"><div class="info-label">Avg Package</div><div class="info-value">${c.avg_package?'₹'+(c.avg_package/100000).toFixed(1)+'L':'N/A'}</div></div>
      </div>
    </div>
    ${courses.length?`<div class="section"><div class="section-title">Courses Offered</div><div class="course-tags">${courses.map(co=>`<span class="course-tag">${co}</span>`).join('')}</div></div>`:''}
    <div class="section"><div class="section-title">Reviews</div>
      <div id="reviewsList"><div class="review-empty">No reviews yet. Be the first to share your experience.</div></div>
      <div class="review-form"><h4>Write a Review</h4>
        <p style="font-size:13px;color:var(--text-secondary);margin-bottom:12px">No login required. Your review will appear after admin approval.</p>
        <div class="rf-type"><button onclick="selectType(this,'student')" class="active">Student</button><button onclick="selectType(this,'alumni')">Alumni</button><button onclick="selectType(this,'parent')">Parent</button></div>
        <div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">Your rating</div>
        <div class="star-select">${[1,2,3,4,5].map(i=>`<button onclick="selectStar(${i})" id="star${i}">&#9733;</button>`).join('')}</div>
        <div class="rf-row"><input type="text" id="revName" placeholder="Your name"><input type="email" id="revEmail" placeholder="Your email"></div>
        <div class="rf-row"><textarea id="revText" placeholder="Share your experience..."></textarea></div>
        <button class="btn-primary" style="width:100%" onclick="submitReview('${id}','${eName}')">Submit Review</button>
        <div id="reviewMsg" style="display:none"></div>
      </div>
    </div>
    ${lat&&lng?`<div class="section"><div class="section-title">Location</div><iframe class="map-frame" loading="lazy" src="https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed"></iframe></div>`:''}
  </div>
  <div class="sidebar">
    <div class="sidebar-card" id="enquiryCard"><div class="sidebar-title">Send an Enquiry</div>
      <p style="font-size:13px;color:var(--text-secondary);margin-bottom:14px">Interested? Send your details and we will connect you.</p>
      <form class="enquiry-form" onsubmit="submitEnquiry(event,'${id}','${eName}')">
        <input type="text" name="pName" placeholder="Your name" required>
        <input type="email" name="pEmail" placeholder="Your email" required>
        <input type="tel" name="pPhone" placeholder="Your phone" required>
        <textarea name="message" placeholder="Your message (optional)"></textarea>
        <button type="submit" class="btn-primary" style="width:100%" id="enquiryBtn">Send Enquiry</button>
      </form>
      <div id="enquiryMsg" style="display:none"></div>
    </div>
    ${c.website?`<div class="sidebar-card"><div class="sidebar-title">Official Website</div><a href="${c.website.startsWith('http')?c.website:'https://'+c.website}" target="_blank" rel="noopener" style="color:var(--accent);font-size:14px;font-weight:500">Visit College Website</a></div>`:''}
    <div class="sidebar-card"><div class="sidebar-title">Quick Actions</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <a href="/compare" style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg-secondary);border-radius:8px;font-size:13px;font-weight:500">Compare with other colleges</a>
        <a href="/colleges" style="display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg-secondary);border-radius:8px;font-size:13px;font-weight:500">Back to all colleges</a>
      </div>
    </div>
    <div class="sidebar-card"><div class="sidebar-title">Share</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <a id="shareWA" href="#" target="_blank" rel="noopener" style="padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;background:#25D366;color:#fff;text-decoration:none">WhatsApp</a>
        <a id="shareTW" href="#" target="_blank" rel="noopener" style="padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;background:#1DA1F2;color:#fff;text-decoration:none">Twitter</a>
        <button onclick="copyPageLink()" id="copyBtn" style="padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;background:var(--bg-secondary);border:1px solid var(--border);cursor:pointer">Copy Link</button>
      </div>
    </div>
  </div></div>`;
  if(autoEnquire)setTimeout(()=>{document.getElementById('enquiryCard').scrollIntoView({behavior:'smooth',block:'center'})},500);
  // Share links
  const _cu=encodeURIComponent('https://wibest.in/college-detail.html?id='+id);
  const _ct=encodeURIComponent((c.name||'College')+' — WIB');
  document.getElementById('shareWA').href='https://wa.me/?text='+_ct+'%20'+_cu;
  document.getElementById('shareTW').href='https://twitter.com/intent/tweet?text='+_ct+'&url='+_cu+'&via=wibest_in';
  loadReviews(id);
}

function copyPageLink(){var b=document.getElementById('copyBtn');navigator.clipboard.writeText(window.location.href).then(function(){b.textContent='Copied!';setTimeout(function(){b.textContent='Copy Link';},2000);});}

function selectStar(n){selectedRating=n;for(let i=1;i<=5;i++){document.getElementById('star'+i).classList.toggle('active',i<=n)}}
function selectType(btn,t){selectedType=t;document.querySelectorAll('.rf-type button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}

async function submitReview(cId,cName){
  const msg=document.getElementById('reviewMsg');
  if(!checkRateLimit('review',30000)){msg.className='form-msg error';msg.textContent='Please wait before submitting another review.';msg.style.display='block';return}
  const v=validateReview(document.getElementById('revName').value,document.getElementById('revEmail').value,document.getElementById('revText').value,selectedRating);
  if(!v.ok){msg.className='form-msg error';msg.textContent=v.error;msg.style.display='block';return}
  try{
    await db.collection('reviews').add({schoolId:cId,schoolName:cName,name:v.name,email:v.email,text:v.text,rating:v.rating,type:selectedType,status:'pending',category:'college',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    msg.className='form-msg success';msg.textContent='Review submitted. It will appear after admin approval.';msg.style.display='block';
    document.getElementById('revName').value='';document.getElementById('revEmail').value='';document.getElementById('revText').value='';selectedRating=0;document.querySelectorAll('.star-select button').forEach(b=>b.classList.remove('active'));
  }catch(e){msg.className='form-msg error';msg.textContent='Failed to submit. Try again.';msg.style.display='block'}
}

async function submitEnquiry(e,cId,cName){
  e.preventDefault();const btn=document.getElementById('enquiryBtn');const msg=document.getElementById('enquiryMsg');
  const f=e.target;
  if(!checkRateLimit('enquiry',60000)){msg.className='form-msg error';msg.textContent='Please wait before sending another enquiry.';msg.style.display='block';return}
  const v=validateEnquiry(f.pName.value,f.pEmail.value,f.pPhone.value);
  if(!v.ok){msg.className='form-msg error';msg.textContent=v.error;msg.style.display='block';return}
  btn.disabled=true;btn.textContent='Sending...';
  try{
    await db.collection('contact_requests').add({schoolId:cId,schoolName:cName,parentName:v.parentName,parentEmail:v.parentEmail,parentPhone:v.parentPhone,message:sanitizeText(f.message.value,1000),status:'pending',category:'college',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    msg.className='form-msg success';msg.textContent='Enquiry sent successfully.';msg.style.display='block';f.reset();
  }catch(err){msg.className='form-msg error';msg.textContent='Failed. Try again.';msg.style.display='block'}
  btn.disabled=false;btn.textContent='Send Enquiry';
}

async function loadReviews(cId){
  try{
    const snap=await db.collection('reviews').where('schoolId','==',cId).where('status','==','approved').get();
    let html='';
    snap.forEach(doc=>{const r=doc.data();html+=`<div class="review-item"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-weight:600;font-size:14px">${escapeHtml(r.name||'Anonymous')} <span style="font-size:11px;color:var(--text-muted);font-weight:400">(${escapeHtml(r.type||'student')})</span></span><span style="color:var(--green);font-weight:600;font-size:13px">${'★'.repeat(r.rating||0)}${'☆'.repeat(5-(r.rating||0))}</span></div><div style="font-size:13px;color:var(--text-secondary)">${escapeHtml(r.text||'')}</div></div>`});
    if(html)document.getElementById('reviewsList').innerHTML=html;
  }catch(e){console.error(e)}
}
load();
</script>
<script src="/chat-widget.js"></script>
</body>
</html>
