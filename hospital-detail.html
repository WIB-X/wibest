<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Hospital details, specialities, ratings, insurance, and patient reviews on WIB.">
<meta property="og:site_name" content="WIB">
<meta property="og:type" content="website">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-JBXR43H9PE"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-JBXR43H9PE');</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
.detail-wrap{margin-top:calc(var(--nav-height)+var(--cat-height));max-width:900px;margin-left:auto;margin-right:auto;padding:40px 24px 64px}
.bc{font-size:12px;color:var(--text-muted);margin-bottom:20px}.bc a{color:var(--accent)}
.hosp-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.hosp-name{font-family:'Outfit',sans-serif;font-size:28px;font-weight:700;letter-spacing:-0.02em;margin:0}
.hosp-meta{font-size:14px;color:var(--text-secondary);margin-top:4px}
.hosp-rating{font-size:28px;font-weight:700;color:var(--green);background:var(--green-bg);padding:12px 20px;border-radius:12px;text-align:center;line-height:1}
.hosp-rating small{display:block;font-size:11px;font-weight:400;color:var(--text-muted);margin-top:4px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:32px}
.info-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center}
.info-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.info-val{font-size:18px;font-weight:700}
.section{margin-bottom:32px}.section-title{font-family:'Outfit',sans-serif;font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:2}
.spec-tags{display:flex;flex-wrap:wrap;gap:8px}.spec-tag{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;background:var(--accent-light);color:var(--accent)}
.ins-tags{display:flex;flex-wrap:wrap;gap:8px}.ins-tag{padding:6px 14px;border-radius:6px;font-size:13px;background:var(--bg-secondary);color:var(--text-secondary);border:1px solid var(--border)}
.action-btns{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:32px}
.action-btns a{padding:14px 28px;border-radius:10px;font-size:14px;font-weight:600;text-decoration:none;text-align:center}
.btn-practo{background:var(--accent);color:#fff}.btn-website{background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border)}
/* Review section */
.rating-overview{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.rating-box{flex:1;min-width:140px;padding:16px;border-radius:8px;background:var(--bg-secondary);text-align:center}
.rating-box .score{font-size:28px;font-weight:700}.rating-box .label{font-size:11px;color:var(--text-muted);text-transform:uppercase;margin-top:4px}
.review-item{padding:14px;background:var(--bg-secondary);border-radius:8px;margin-bottom:8px}
.review-header{display:flex;justify-content:space-between;margin-bottom:6px}
.review-name{font-weight:600;font-size:14px}.review-stars{color:var(--green);font-weight:600;font-size:13px}
.review-text{font-size:13px;color:var(--text-secondary);line-height:1.6}.review-date{font-size:11px;color:var(--text-muted);margin-top:4px}
.review-empty{color:var(--text-muted);font-size:14px;padding:16px;text-align:center;background:var(--bg-secondary);border-radius:8px}
/* Review form */
.review-form{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-top:16px}
.review-form h4{font-family:'Outfit',sans-serif;font-size:16px;font-weight:600;margin-bottom:4px}
.review-form p{font-size:13px;color:var(--text-secondary);margin-bottom:16px}
.rf-type{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.rf-type button{padding:8px 16px;border-radius:6px;border:1px solid var(--border);background:var(--bg-secondary);color:var(--text-secondary);font-family:inherit;font-size:13px;cursor:pointer;transition:all .2s}
.rf-type button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.star-select{display:flex;gap:6px;margin-bottom:16px}
.star-select button{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--bg-secondary);cursor:pointer;font-size:18px;transition:all .2s;color:var(--text-muted)}
.star-select button.active{background:var(--green-bg);color:var(--green);border-color:var(--green)}
.star-select button:hover{border-color:var(--green)}
.criteria-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.criteria-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg-secondary);border-radius:8px;font-size:13px}
.criteria-item label{color:var(--text-secondary)}
.criteria-stars{display:flex;gap:2px}
.criteria-stars button{width:24px;height:24px;border:none;background:none;cursor:pointer;font-size:14px;color:var(--text-muted);padding:0}
.criteria-stars button.active{color:var(--green)}
.rf-row{display:flex;gap:12px;margin-bottom:12px}
.rf-row input,.rf-row textarea{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg-secondary);color:var(--text-primary);font-family:inherit;font-size:14px}
.rf-row input:focus,.rf-row textarea:focus{outline:none;border-color:var(--accent)}
.rf-row textarea{resize:vertical;min-height:80px}
.form-msg{font-size:13px;text-align:center;padding:10px;border-radius:6px;margin-top:8px}
.form-msg.success{background:var(--green-bg);color:var(--green)}.form-msg.error{background:#fef2f2;color:var(--red)}
.loading{text-align:center;padding:100px 24px;color:var(--text-muted)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.share-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:28px}
.share-row span{font-size:13px;font-weight:600;color:var(--text-muted)}
@media(max-width:768px){.hosp-name{font-size:22px}.info-grid{grid-template-columns:1fr 1fr}.criteria-grid{grid-template-columns:1fr}.rf-row{flex-direction:column}}
</style>
<script src="/affiliate-config.js" async></script>
<script src="/ads.js" async></script>
</head>
<body>
<div id="wib-nav-placeholder"></div>

<div class="detail-wrap" id="content">
  <div class="skeleton" style="height:300px;margin-bottom:16px"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="skeleton" style="height:120px"></div><div class="skeleton" style="height:120px"></div></div>
</div>

<div id="wib-footer-placeholder"></div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js" defer></script>
<script src="/config.js"></script>
<script src="/components.js?v=20260505a"></script>
<script src="/polish.js?v=20260419" defer></script>
<script src="/cookie-consent.js" defer></script>
<script src="/widgets.js" defer></script>
<script src="/sanitize.js"></script>
<script src="/hospitals-data.js?v=20260428b"></script>
<script>
var db=initFirebase();
var selectedRating=0;
var selectedType='patient';
var criteriaRatings={doctors:0,infrastructure:0,nursing:0,cleanliness:0,wait_time:0};

var params=new URLSearchParams(window.location.search);
var hospName=params.get('name')||'';
var hospCity=params.get('city')||'';

if(!hospName){
  document.getElementById('content').innerHTML='<div class="bc"><a href="/">Home</a> / <a href="/hospitals/">Hospitals</a></div><h1>Hospital not found</h1><p>Please select a hospital from the <a href="/hospitals/">hospitals listing</a>.</p>';
} else {
  document.title=decodeURIComponent(hospName)+' - Hospital Details - WIB';
  var nameDecoded = decodeURIComponent(hospName);
  var cityDecoded = decodeURIComponent(hospCity);
  // Look up the hospital from the shared data file (name + city is unique key)
  var dataset = window.WIB_HOSPITALS || [];
  var match = dataset.find(function(x){
    return x.n === nameDecoded && (!cityDecoded || x.c === cityDecoded);
  }) || dataset.find(function(x){return x.n === nameDecoded}) || {};

  var h = {n: nameDecoded, c: match.c || cityDecoded};
  var _hospUrl='https://wibest.in/hospital-detail.html?name='+encodeURIComponent(hospName)+(cityDecoded?'&city='+encodeURIComponent(cityDecoded):'');
  var _bcScript=document.createElement('script');_bcScript.type='application/ld+json';_bcScript.text=JSON.stringify({'@context':'https://schema.org','@type':'BreadcrumbList','itemListElement':[{'@type':'ListItem','position':1,'name':'Home','item':'https://wibest.in'},{'@type':'ListItem','position':2,'name':'Hospitals','item':'https://wibest.in/hospitals/'},{'@type':'ListItem','position':3,'name':nameDecoded,'item':_hospUrl}]});document.head.appendChild(_bcScript);

  // Hospital data: prefer the matched record from the dataset; URL params are fallback only.
  var hType  = match.t  || params.get('type') || '';
  var hRating= match.r  || parseFloat(params.get('r')) || 0;
  var hBeds  = match.b  || parseInt(params.get('b'))   || 0;
  var hEst   = match.e  || parseInt(params.get('e'))   || 0;
  var hSpecs = match.s  || (params.get('s')||'').split(',').filter(Boolean);
  var hIns   = match.i  || (params.get('i')||'').split(',').filter(Boolean);
  var hAccr  = match.a  || params.get('a') || '';
  var hEr    = (typeof match.er !== 'undefined') ? !!match.er : (params.get('er')==='1');
  var hWeb   = match.w  || params.get('w') || '';
  var hAddr  = match.addr  || '';
  var hPhone = match.phone || '';
  h.address  = hAddr;

  // Practo URL (real, not Google search): https://www.practo.com/[city]/hospitals?q=[name]
  var practoUrl = (window.WIB_practoUrl)
    ? window.WIB_practoUrl(h.n, h.c)
    : 'https://www.practo.com/' + encodeURIComponent((h.c||'').toLowerCase().replace(/\s+/g,'-')) + '/hospitals?q=' + encodeURIComponent(h.n);
  
  var safeName=h.n.replace(/'/g,"\\'");
  
  document.getElementById('content').innerHTML=`
  <div class="bc"><a href="/">Home</a> / <a href="/hospitals/">Hospitals</a> / ${h.n}</div>
  <div class="hosp-header">
    <div>
      <h1 class="hosp-name">${h.n}</h1>
      <div class="hosp-meta">${h.c} | ${hType} | Est. ${hEst||'N/A'} | ${hBeds?hBeds+' beds':''}${hAccr?' | '+hAccr:''}</div>
    </div>
    ${hRating?`<div class="hosp-rating">${hRating.toFixed(1)}<small>Rating</small></div>`:''}
  </div>
  
  <div class="info-grid">
    <div class="info-card"><div class="info-label">Type</div><div class="info-val">${hType||'Hospital'}</div></div>
    <div class="info-card"><div class="info-label">Beds</div><div class="info-val">${hBeds?hBeds.toLocaleString():'N/A'}</div></div>
    <div class="info-card"><div class="info-label">Emergency</div><div class="info-val" style="color:${hEr?'var(--green)':'var(--text-muted)'}">${hEr?'24/7 Available':'Not Available'}</div></div>
    <div class="info-card"><div class="info-label">Established</div><div class="info-val">${hEst||'N/A'}</div></div>
  </div>

  <div class="action-btns">
    ${hPhone?`<a href="tel:${hPhone.replace(/[^+\d]/g,'')}" class="btn-practo">Call ${hPhone}</a>`:''}
    <a href="${practoUrl}" target="_blank" rel="noopener" class="btn-website">Find on Practo</a>
    ${hWeb?`<a href="${hWeb}" target="_blank" rel="noopener" class="btn-website">Official Website</a>`:''}
    <a href="/compare?type=hospitals" class="btn-website">Compare Hospitals</a>
  </div>

  <div class="share-row">
    <span>Share:</span>
    <a id="shareWA" href="#" target="_blank" rel="noopener" style="padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;background:#25D366;color:#fff;text-decoration:none">WhatsApp</a>
    <a id="shareTW" href="#" target="_blank" rel="noopener" style="padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;background:#1DA1F2;color:#fff;text-decoration:none">Twitter</a>
    <button onclick="copyPageLink()" id="copyBtn" style="padding:8px 14px;border-radius:8px;font-size:12px;font-weight:600;background:var(--bg-secondary);border:1px solid var(--border);cursor:pointer;font-family:inherit">Copy Link</button>
  </div>

  ${hSpecs.length?`<div class="section"><div class="section-title"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg> Specialities</div><div class="spec-tags">${hSpecs.map(s=>`<span class="spec-tag">${s}</span>`).join('')}</div></div>`:''}

  ${hIns.length?`<div class="section"><div class="section-title"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v3"/></svg> Insurance Accepted</div><div class="ins-tags">${hIns.map(i=>`<span class="ins-tag">${i}</span>`).join('')}</div></div>`:''}

  ${(function(){
    var addr = h.address || h.location || (h.c ? (h.n + ', ' + h.c) : '');
    if(!addr) return '';
    return '<div class="section"><div class="section-title"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> Location</div>'
      + '<div style="margin-bottom:14px;font-size:14px;color:var(--text-secondary);line-height:1.55"><strong style="color:var(--text-primary);font-weight:600">Address:</strong> ' + addr + '</div>'
      + '<iframe class="map-frame" loading="lazy" style="width:100%;height:260px;border:0;border-radius:10px" src="https://maps.google.com/maps?q=' + encodeURIComponent(addr) + '&z=15&output=embed"></iframe>'
      + '<div style="margin-top:10px"><a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(addr) + '" target="_blank" rel="noopener" style="font-size:13px;color:var(--accent);font-weight:600">Open in Google Maps \u2192</a></div>'
      + '</div>';
  })()}

  <div class="section">
    <div class="section-title"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Patient Reviews</div>
    <div class="rating-overview">
      <div class="rating-box"><div class="score" id="overallScore">-</div><div class="label">Overall Rating</div></div>
      <div class="rating-box"><div class="score" id="doctorScore">-</div><div class="label">Doctors</div></div>
      <div class="rating-box"><div class="score" id="infraScore">-</div><div class="label">Infrastructure</div></div>
      <div class="rating-box"><div class="score" id="cleanScore">-</div><div class="label">Cleanliness</div></div>
    </div>
    <div id="reviewsList"><div class="review-empty">No reviews yet. Be the first to review this hospital.</div></div>
  </div>

  <div class="review-form">
    <h4>Write a Review for ${h.n}</h4>
    <p>No login required. Your review will appear after admin approval.</p>
    <div class="rf-type">
      <button class="active" onclick="selectType(this,'patient')">Patient</button>
      <button onclick="selectType(this,'visitor')">Visitor</button>
      <button onclick="selectType(this,'staff')">Staff</button>
    </div>
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:4px">Overall rating</div>
    <div class="star-select" id="starSelect">
      <button onclick="selectStar(1)" id="star1">&#9733;</button>
      <button onclick="selectStar(2)" id="star2">&#9733;</button>
      <button onclick="selectStar(3)" id="star3">&#9733;</button>
      <button onclick="selectStar(4)" id="star4">&#9733;</button>
      <button onclick="selectStar(5)" id="star5">&#9733;</button>
    </div>
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:8px">Rate specific areas (optional)</div>
    <div class="criteria-grid">
      <div class="criteria-item"><label>Doctors</label><div class="criteria-stars" id="crit-doctors">${[1,2,3,4,5].map(i=>`<button onclick="setCriteria('doctors',${i})" id="cd${i}">&#9733;</button>`).join('')}</div></div>
      <div class="criteria-item"><label>Infrastructure</label><div class="criteria-stars" id="crit-infrastructure">${[1,2,3,4,5].map(i=>`<button onclick="setCriteria('infrastructure',${i})" id="ci${i}">&#9733;</button>`).join('')}</div></div>
      <div class="criteria-item"><label>Nursing Staff</label><div class="criteria-stars" id="crit-nursing">${[1,2,3,4,5].map(i=>`<button onclick="setCriteria('nursing',${i})" id="cn${i}">&#9733;</button>`).join('')}</div></div>
      <div class="criteria-item"><label>Cleanliness</label><div class="criteria-stars" id="crit-cleanliness">${[1,2,3,4,5].map(i=>`<button onclick="setCriteria('cleanliness',${i})" id="cc${i}">&#9733;</button>`).join('')}</div></div>
      <div class="criteria-item"><label>Wait Time</label><div class="criteria-stars" id="crit-wait_time">${[1,2,3,4,5].map(i=>`<button onclick="setCriteria('wait_time',${i})" id="cw${i}">&#9733;</button>`).join('')}</div></div>
    </div>
    <div class="rf-row"><input type="text" id="revName" placeholder="Your name"><input type="email" id="revEmail" placeholder="Your email"></div>
    <div class="rf-row"><textarea id="revText" placeholder="Share your experience - treatment quality, staff behaviour, facilities, billing transparency..."></textarea></div>
    <button class="btn-primary" style="width:100%;padding:14px;font-size:14px" onclick="submitReview()">Submit Review</button>
    <div id="reviewMsg" style="display:none"></div>
  </div>`;

  // Share links
  var _cu=encodeURIComponent('https://wibest.in/hospital-detail.html?name='+encodeURIComponent(hospName)+(hospCity?'&city='+encodeURIComponent(hospCity):''));
  var _ct=encodeURIComponent(h.n+' — WIB');
  document.getElementById('shareWA').href='https://wa.me/?text='+_ct+'%20'+_cu;
  document.getElementById('shareTW').href='https://twitter.com/intent/tweet?text='+_ct+'&url='+_cu+'&via=wibest_in';

  // Hospital JSON-LD with full address + phone + rating + specialties
  var _jld = {
    '@context':'https://schema.org','@type':'Hospital',
    'name': h.n,
    'description':'Hospital in '+h.c+', India',
    'url': _hospUrl,
    'address':{'@type':'PostalAddress','addressLocality': h.c,'addressCountry':'IN'}
  };
  if (hAddr) _jld.address.streetAddress = hAddr;
  if (hPhone) _jld.telephone = hPhone;
  if (hWeb) _jld.sameAs = [hWeb];
  if (hRating > 0) _jld.aggregateRating = {'@type':'AggregateRating','ratingValue': hRating,'bestRating':5,'ratingCount':10};
  if (hSpecs.length) _jld.medicalSpecialty = hSpecs;
  var _ls = document.createElement('script');_ls.type='application/ld+json';_ls.text=JSON.stringify(_jld);document.head.appendChild(_ls);

  loadReviews();
}

function selectType(btn,type){
  document.querySelectorAll('.rf-type button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  selectedType=type;
}

function selectStar(n){
  selectedRating=n;
  for(var i=1;i<=5;i++){document.getElementById('star'+i).classList.toggle('active',i<=n)}
}

function setCriteria(key,val){
  criteriaRatings[key]=val;
  var prefix={doctors:'cd',infrastructure:'ci',nursing:'cn',cleanliness:'cc',wait_time:'cw'}[key];
  for(var i=1;i<=5;i++){document.getElementById(prefix+i).classList.toggle('active',i<=val)}
}

async function submitReview(){
  var msg=document.getElementById('reviewMsg');
  if(!checkRateLimit('review',30000)){msg.className='form-msg error';msg.textContent='Please wait before submitting another review.';msg.style.display='block';return;}
  var v=validateReview(document.getElementById('revName').value,document.getElementById('revEmail').value,document.getElementById('revText').value,selectedRating);
  if(!v.ok){msg.className='form-msg error';msg.textContent=v.error;msg.style.display='block';return;}

  try{
    await db.collection('reviews').add({
      hospitalName:hospName,
      hospitalCity:hospCity,
      name:v.name,
      email:v.email,
      text:v.text,
      rating:v.rating,
      type:selectedType,
      category:'hospital',
      criteria:criteriaRatings,
      status:'pending',
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    msg.className='form-msg success';
    msg.textContent='Thank you! Your review has been submitted and will appear after admin approval.';
    msg.style.display='block';
    document.getElementById('revName').value='';
    document.getElementById('revEmail').value='';
    document.getElementById('revText').value='';
    selectedRating=0;
    criteriaRatings={doctors:0,infrastructure:0,nursing:0,cleanliness:0,wait_time:0};
    document.querySelectorAll('.star-select button, .criteria-stars button').forEach(b=>b.classList.remove('active'));
  }catch(e){
    msg.className='form-msg error';msg.textContent='Failed to submit. Please try again.';msg.style.display='block';
  }
}

function copyPageLink(){var b=document.getElementById('copyBtn');navigator.clipboard.writeText(window.location.href).then(function(){b.textContent='Copied!';setTimeout(function(){b.textContent='Copy Link';},2000);});}

async function loadReviews(){
  try{
    var snap=await db.collection('reviews').where('hospitalName','==',hospName).where('status','==','approved').orderBy('createdAt','desc').get();
    var html='',totalR=0,count=0,docT=0,docC=0,infT=0,infC=0,clnT=0,clnC=0;
    snap.forEach(function(doc){
      var r=doc.data();count++;totalR+=r.rating||0;
      if(r.criteria){
        if(r.criteria.doctors){docT+=r.criteria.doctors;docC++}
        if(r.criteria.infrastructure){infT+=r.criteria.infrastructure;infC++}
        if(r.criteria.cleanliness){clnT+=r.criteria.cleanliness;clnC++}
      }
      var stars='★'.repeat(r.rating||0)+'☆'.repeat(5-(r.rating||0));
      html+='<div class="review-item"><div class="review-header"><span class="review-name">'+
        escapeHtml(r.name||'Anonymous')+' <span style="font-size:11px;color:var(--text-muted);font-weight:400">('+
        escapeHtml(r.type||'patient')+')</span></span><span class="review-stars">'+stars+'</span></div>'+
        (r.text?'<div class="review-text">'+escapeHtml(r.text)+'</div>':'')+
        '</div>';
    });
    if(html)document.getElementById('reviewsList').innerHTML=html;
    if(count>0)document.getElementById('overallScore').textContent=(totalR/count).toFixed(1);
    if(docC>0)document.getElementById('doctorScore').textContent=(docT/docC).toFixed(1);
    if(infC>0)document.getElementById('infraScore').textContent=(infT/infC).toFixed(1);
    if(clnC>0)document.getElementById('cleanScore').textContent=(clnT/clnC).toFixed(1);
  }catch(e){console.error('Reviews error:',e)}
}
</script>
