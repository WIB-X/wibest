<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Article — WIB</title>
<meta name="description" content="Read this guide on WIB — India's comparison platform.">
<meta property="og:site_name" content="WIB">
<meta property="og:type" content="article">
<meta property="og:image" content="https://wibest.in/og-default.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@wibest_in">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
.article{max-width:720px;margin:calc(var(--nav-height)+var(--cat-height)+48px) auto 60px;padding:0 24px}
.breadcrumb{font-size:13px;color:var(--text-muted);margin-bottom:24px}.breadcrumb a{color:var(--accent)}
.article-category{font-size:12px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.article h1{font-family:'Outfit',sans-serif;font-size:36px;font-weight:700;letter-spacing:-0.02em;line-height:1.2;margin-bottom:16px}
.article-meta{display:flex;gap:16px;font-size:13px;color:var(--text-muted);margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border)}
.article-body{font-size:16px;line-height:1.85;color:var(--text-secondary)}
.article-body h2{font-family:'Outfit',sans-serif;font-size:22px;font-weight:600;color:var(--text-primary);margin:32px 0 12px}
.article-body h3{font-family:'Outfit',sans-serif;font-size:18px;font-weight:600;color:var(--text-primary);margin:24px 0 8px}
.article-body p{margin-bottom:16px}
.article-body ul,.article-body ol{margin-bottom:16px;padding-left:24px}
.article-body li{margin-bottom:8px}
.article-body a{color:var(--accent)}
.article-body blockquote{border-left:3px solid var(--accent);padding:12px 20px;margin:16px 0;background:var(--bg-secondary);border-radius:0 8px 8px 0;font-style:italic}
.article-footer{margin-top:40px;padding-top:24px;border-top:1px solid var(--border);display:flex;gap:12px;flex-wrap:wrap}
.loading{text-align:center;padding:100px 24px;color:var(--text-muted)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
/* Table of Contents */
.toc{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:20px 24px;margin:0 0 32px}
.toc-title{font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:12px}
.toc ul{list-style:none;padding:0;margin:0}
.toc li{margin-bottom:6px}
.toc li a{font-size:14px;color:var(--accent);text-decoration:none;line-height:1.4}
.toc li a:hover{text-decoration:underline}
.toc li.toc-sub{padding-left:16px}
.toc li.toc-sub a{font-size:13px;color:var(--text-secondary)}
/* Related posts */
.related{margin-top:48px;padding-top:32px;border-top:1px solid var(--border)}
.related h2{font-family:'Outfit',sans-serif;font-size:20px;font-weight:700;margin-bottom:20px}
.related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.related-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:18px;text-decoration:none;display:block;transition:border-color .15s,box-shadow .15s}
.related-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md)}
.related-card .rc-cat{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.related-card .rc-title{font-size:14px;font-weight:600;color:var(--text-primary);line-height:1.4}
.related-card .rc-time{font-size:12px;color:var(--text-muted);margin-top:8px}
@media(max-width:768px){.article h1{font-size:26px}.article-body{font-size:15px}}
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-JBXR43H9PE"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag("js",new Date());gtag("config","G-JBXR43H9PE");</script>
<link rel="canonical" href="https://wibest.in/blog-post.html">
</head>
<body>
<div id="wib-nav-placeholder"></div>

<div class="article" id="articleContent"><div class="loading"><div class="spinner"></div><p>Loading article...</p></div></div>
<div id="wib-footer-placeholder"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="/config.js"></script>
<script src="/components.js"></script>
<script src="/sanitize.js"></script>
<script>
const db=initFirebase();

function calcReadTime(html){
  const text=html.replace(/<[^>]+>/g,' ');
  const words=text.trim().split(/\s+/).filter(w=>w.length>0).length;
  return Math.max(1,Math.ceil(words/200));
}

function buildTOC(htmlContent){
  const tmp=document.createElement('div');
  tmp.innerHTML=htmlContent;
  const headings=Array.from(tmp.querySelectorAll('h2,h3'));
  if(headings.length<2)return{toc:'',html:htmlContent};
  let items='';
  headings.forEach((h,i)=>{
    const id='sec-'+i;
    h.id=id;
    const cls=h.tagName==='H3'?' class="toc-sub"':'';
    items+=`<li${cls}><a href="#${id}">${escapeHtml(h.textContent)}</a></li>`;
  });
  const toc=`<nav class="toc"><div class="toc-title">On this page</div><ul>${items}</ul></nav>`;
  return{toc,html:tmp.innerHTML};
}

async function loadRelated(currentId,category){
  try{
    const snap=await db.collection('blog_posts').where('category','==',category).where('status','==','published').limit(6).get();
    const posts=[];
    snap.forEach(d=>{if(d.id!==currentId)posts.push({id:d.id,...d.data()})});
    if(posts.length===0)return'';
    const cards=posts.slice(0,3).map(r=>{
      const rt=r.read_time||r.readTime||calcReadTime(r.content||r.body||'');
      return`<a href="/blog-post.html?id=${encodeURIComponent(r.id)}" class="related-card"><div class="rc-cat">${escapeHtml(r.category||'General')}</div><div class="rc-title">${escapeHtml(r.title||'Untitled')}</div><div class="rc-time">${rt} min read</div></a>`;
    }).join('');
    return`<div class="related"><h2>Related Articles</h2><div class="related-grid">${cards}</div></div>`;
  }catch(e){return'';}
}

async function load(){
  const id=new URLSearchParams(window.location.search).get('id');
  if(!id){document.getElementById('articleContent').innerHTML='<div class="loading">Article not found. <a href="/blog" style="color:var(--accent)">Back to Blog</a></div>';return}
  try{
    const doc=await db.collection('blog_posts').doc(id).get();
    if(!doc.exists){document.getElementById('articleContent').innerHTML='<div class="loading">Article not found. <a href="/blog" style="color:var(--accent)">Back to Blog</a></div>';return}
    const p=doc.data();
    const title=p.title||'Untitled';
    document.title=title+' — WIB Blog';
    document.querySelector('meta[name="description"]').setAttribute('content',p.excerpt||p.description||title);
    document.querySelector('meta[property="og:type"]').setAttribute('content','article');
    if(p.cover_image)document.querySelector('meta[property="og:image"]').setAttribute('content',p.cover_image);
    const canonicalUrl='https://wibest.in/blog-post.html?id='+id;
    document.querySelector('link[rel="canonical"]').setAttribute('href',canonicalUrl);
    const jsonLd={'@context':'https://schema.org','@type':'Article','headline':title,'description':p.excerpt||title,'author':{'@type':'Person','name':p.author||'WIB Team'},'publisher':{'@type':'Organization','name':'WIB','url':'https://wibest.in'},'url':canonicalUrl,'wordCount':Math.round((p.content||'').replace(/<[^>]+>/g,' ').split(/\s+/).length)};
    if(p.cover_image)jsonLd['image']=p.cover_image;
    if(p.createdAt?.toDate)jsonLd['datePublished']=p.createdAt.toDate().toISOString();
    const ldScript=document.createElement('script');ldScript.type='application/ld+json';ldScript.text=JSON.stringify(jsonLd);document.head.appendChild(ldScript);
    const bcScript=document.createElement('script');bcScript.type='application/ld+json';bcScript.text=JSON.stringify({'@context':'https://schema.org','@type':'BreadcrumbList','itemListElement':[{'@type':'ListItem','position':1,'name':'Home','item':'https://wibest.in'},{'@type':'ListItem','position':2,'name':'Blog','item':'https://wibest.in/blog/'},{'@type':'ListItem','position':3,'name':title,'item':canonicalUrl}]});document.head.appendChild(bcScript);

    const rawContent=p.content||p.body||'<p>Content not available.</p>';
    const readTime=p.read_time||p.readTime||calcReadTime(rawContent);
    const{toc,html:processedContent}=buildTOC(rawContent);
    const date=p.createdAt?.toDate?p.createdAt.toDate().toLocaleDateString('en-IN',{year:'numeric',month:'long',day:'numeric'}):'';

    // Load related posts in parallel (non-blocking)
    const relatedHtml=await loadRelated(id,p.category||'');

    document.getElementById('articleContent').innerHTML=`
      <div class="breadcrumb"><a href="/blog">Blog</a> / ${escapeHtml(title)}</div>
      ${p.cover_image?`<img src="${escapeHtml(p.cover_image)}" alt="${escapeHtml(title)}" loading="lazy" style="width:100%;height:320px;object-fit:cover;border-radius:12px;margin-bottom:24px">`:''}
      <div class="article-category">${escapeHtml(p.category||'General')}</div>
      <h1>${escapeHtml(title)}</h1>
      <div class="article-meta">
        <span>⏱ ${readTime} min read</span>
        ${date?`<span>📅 ${escapeHtml(date)}</span>`:''}
        ${p.author?`<span>By ${escapeHtml(p.author)}</span>`:''}
      </div>
      ${toc}
      <div class="article-body">${processedContent}</div>
      ${relatedHtml}
      <div class="article-footer">
        <a href="/blog" class="btn-secondary" style="font-size:13px;padding:10px 20px">← Back to Blog</a>
        <a href="/schools" class="btn-secondary" style="font-size:13px;padding:10px 20px">Browse Schools</a>
        <a href="/colleges" class="btn-secondary" style="font-size:13px;padding:10px 20px">Browse Colleges</a>
      </div>
    `;
  }catch(err){
    console.error(err);
    document.getElementById('articleContent').innerHTML='<div class="loading">Error loading article. <a href="/blog" style="color:var(--accent)">Back to Blog</a></div>';
  }
}
load();
</script>
<script src="/chat-widget.js"></script>
</body>
</html>
